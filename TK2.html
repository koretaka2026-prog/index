/* =========================================================
RETRO MAZE
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const TILE = 32;
const COLS = 20;
const ROWS = 14;

const W = 640;
const H = 448;

const C = {
black: "#000",
pink: "#ff3cac",
pinkDark: "#a51c71",
green: "#dfff00",
greenDark: "#789000",
white: "#fff",
red: "#ff304f",
blue: "#22d8ff",
purple: "#713bc7",
skin: "#ffd0a8"
};

/* ---------------------------------------------------------
マップ
= 壁

. = 通路
P = プレイヤー
G = ゴール
--------------------------------------------------------- */

const levels = [

[
"####################",
"#P.....#...........#",
"#.###..#.#########.#",
"#...#..#.#.......#.#",
"###.#.##.#.#####.#.#",
"#...#....#.....#.#.#",
"#.###########.#.#.#",
"#...........#.#...#",
"#.#########.#.#####",
"#.#.......#.#.....#",
"#.#.#####.#.#####.#",
"#...#.....#.......#",
"#.###.###########G#",
"####################"
],

[
"####################",
"#P....#............#",
"#.##..#.############",
"#....##.............#",
"####.###########.###",
"#....#........#....#",
"#.####.######.#.##.#",
"#......#....#.#....#",
"######.#.##.#.######",
"#......#.#..#......#",
"#.######.#.#########",
"#........#..........#",
"#.################G#",
"####################"
],

[
"####################",
"#P........#........#",
"#########.#.######.#",
"#.........#......#.#",
"#.##############.#.#",
"#.#............#.#.#",
"#.#.##########.#.#.#",
"#.#.#........#.#...#",
"#.#.#.######.#.###.#",
"#...#.#....#.#.....#",
"#####.#.##.#.#######",
"#.....#....#.......#",
"#.###############G#",
"####################"
]

];

/* --------------------------------------------------------- */

let currentStage = 0;

let map = [];

let player = {
x: 1,
y: 1,
dir: "right"
};

let goal = {
x: 18,
y: 12
};

let enemies = [];
let items = [];

let score = 0;
let lives = 3;

let running = false;
let gameOver = false;

let animationTime = 0;
let enemyTimer = 0;

const keyState = {};

/* ---------------------------------------------------------
スタート
--------------------------------------------------------- */

function startGame() {

currentStage = 0;
score = 0;
lives = 3;

running = true;
gameOver = false;

loadStage(currentStage);

document.getElementById("message").style.display = "none";

updateHUD();

animationTime = 0;
enemyTimer = 0;

lastTime = performance.now();

requestAnimationFrame(gameLoop);
}

/* ---------------------------------------------------------
ステージ読み込み
--------------------------------------------------------- */

function loadStage(index) {

map = levels[index].map(row => row.split(""));

enemies = [];
items = [];

/* プレイヤーとゴールを探す */

for (let y = 0; y < ROWS; y++) {

for (let x = 0; x < COLS; x++) {

  if (map[y][x] === "P") {

    player.x = x;
    player.y = y;

    map[y][x] = ".";
  }

  if (map[y][x] === "G") {

    goal.x = x;
    goal.y = y;

    map[y][x] = ".";
  }

}

}

/* アイテム */

const itemSets = [
[
[5,1],
[3,5],
[9,7],
[15,11]
],
[
[4,1],
[12,3],
[2,7],
[16,9]
],
[
[7,3],
[3,7],
[10,9],
[15,11]
]
];

for (let i = 0; i < itemSets[index].length; i++) {

const p = itemSets[index][i];

if (!isWall(p[0], p[1])) {

  items.push({
    x: p[0],
    y: p[1],
    type: i % 2 === 0 ? "star" : "gem",
    collected: false
  });

}

}

/* 敵 */

const enemySets = [
[
[6,1],
[11,7]
],
[
[5,5],
[15,9]
],
[
[8,3],
[11,7],
[5,9]
]
];

for (let i = 0; i < enemySets[index].length; i++) {

const p = enemySets[index][i];

if (!isWall(p[0], p[1])) {

  enemies.push({
    x: p[0],
    y: p[1],
    dx: i % 2 === 0 ? 1 : -1,
    dy: 0
  });

}

}
}

/* --------------------------------------------------------- */

function isWall(x, y) {

if (x < 0 || x >= COLS ||
y < 0 || y >= ROWS) {
return true;
}

return map[y][x] === "#";
}

/* ---------------------------------------------------------
プレイヤー移動
--------------------------------------------------------- */

function movePlayer(dir) {

if (!running || gameOver) return;

let dx = 0;
let dy = 0;

if (dir === "up") {
dy = -1;
}

if (dir === "down") {
dy = 1;
}

if (dir === "left") {
dx = -1;
}

if (dir === "right") {
dx = 1;
}

player.dir = dir;

const nx = player.x + dx;
const ny = player.y + dy;

/* 壁 */

if (isWall(nx, ny)) {
return;
}

player.x = nx;
player.y = ny;

score += 5;

collectItems();

checkEnemy();

checkGoal();

updateHUD();
}

/* ---------------------------------------------------------
キーボード
--------------------------------------------------------- */

document.addEventListener("keydown", function(e) {

if (e.key === "ArrowUp" ||
e.key === "ArrowDown" ||
e.key === "ArrowLeft" ||
e.key === "ArrowRight") {

e.preventDefault();

keyState[e.key] = true;

}

});

document.addEventListener("keyup", function(e) {

keyState[e.key] = false;

});

/* ---------------------------------------------------------
タッチ・マウス
--------------------------------------------------------- */

document.querySelectorAll(".pad").forEach(function(button) {

function press(e) {

e.preventDefault();

const dir = button.dataset.dir;

movePlayer(dir);

}

button.addEventListener("pointerdown", press);

button.addEventListener("click", press);

});

/* ---------------------------------------------------------
スタートボタン
--------------------------------------------------------- */

const startButton =
document.getElementById("startButton");

startButton.addEventListener("click", function(e) {

e.preventDefault();

startGame();

});

startButton.addEventListener("pointerup", function(e) {

e.preventDefault();

startGame();

});

/* ---------------------------------------------------------
アイテム
--------------------------------------------------------- */

function collectItems() {

for (const item of items) {

if (item.collected) continue;

if (
  item.x === player.x &&
  item.y === player.y
) {

  item.collected = true;

  if (item.type === "star") {
    score += 500;
  } else {
    score += 1000;
  }

  showFlash("+ BONUS!", C.green);
}

}
}

/* ---------------------------------------------------------
敵
--------------------------------------------------------- */

function updateEnemies() {

for (const enemy of enemies) {

let nx = enemy.x + enemy.dx;
let ny = enemy.y + enemy.dy;

if (isWall(nx, ny)) {

  const dirs = [
    {dx:1, dy:0},
    {dx:-1, dy:0},
    {dx:0, dy:1},
    {dx:0, dy:-1}
  ];

  const possible = dirs.filter(d =>
    !isWall(
      enemy.x + d.dx,
      enemy.y + d.dy
    )
  );

  if (possible.length > 0) {

    const d =
      possible[
        Math.floor(Math.random() * possible.length)
      ];

    enemy.dx = d.dx;
    enemy.dy = d.dy;

    nx = enemy.x + enemy.dx;
    ny = enemy.y + enemy.dy;
  }
}

if (!isWall(nx, ny)) {

  enemy.x = nx;
  enemy.y = ny;
}

}

checkEnemy();
}

/* --------------------------------------------------------- */

function checkEnemy() {

for (const enemy of enemies) {

if (
  enemy.x === player.x &&
  enemy.y === player.y
) {

  loseLife();

  return;
}

}
}

/* --------------------------------------------------------- */

function loseLife() {

lives--;

updateHUD();

if (lives <= 0) {

running = false;
gameOver = true;

showGameOver();

return;

}

showFlash("OUCH!", C.red);

const start = findStart();

player.x = start.x;
player.y = start.y;
}

/* --------------------------------------------------------- */

function findStart() {

const level = levels[currentStage];

for (let y = 0; y < ROWS; y++) {

for (let x = 0; x < COLS; x++) {

  if (level[y][x] === "P") {

    return {
      x: x,
      y: y
    };

  }
}

}

return {
x: 1,
y: 1
};
}

/* ---------------------------------------------------------
ゴール
--------------------------------------------------------- */

function checkGoal() {

if (
player.x === goal.x &&
player.y === goal.y
) {

score += 2000;

if (currentStage < levels.length - 1) {

  running = false;

  showFlash("STAGE CLEAR!", C.green);

  setTimeout(function() {

    currentStage++;

    loadStage(currentStage);

    running = true;

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);

    updateHUD();

  }, 900);

} else {

  running = false;

  setTimeout(showVictory, 500);
}

}
}

/* ---------------------------------------------------------
キーボード処理
--------------------------------------------------------- */

function processKeys() {

if (keyState["ArrowUp"]) {

keyState["ArrowUp"] = false;

movePlayer("up");

} else if (keyState["ArrowDown"]) {

keyState["ArrowDown"] = false;

movePlayer("down");

} else if (keyState["ArrowLeft"]) {

keyState["ArrowLeft"] = false;

movePlayer("left");

} else if (keyState["ArrowRight"]) {

keyState["ArrowRight"] = false;

movePlayer("right");

}

}

/* ---------------------------------------------------------
描画
--------------------------------------------------------- */

function draw() {

ctx.fillStyle = C.black;

ctx.fillRect(0, 0, W, H);

/* マップ */

for (let y = 0; y < ROWS; y++) {

for (let x = 0; x < COLS; x++) {

  if (map[y][x] === "#") {

    drawWall(x, y);

  } else {

    drawPath(x, y);

  }
}

}

drawGoal();

drawItems();

drawEnemies();

drawPlayer();

/* CRT */

ctx.fillStyle = "rgba(255,255,255,.035)";

for (let y = 0; y < H; y += 4) {

ctx.fillRect(0, y, W, 1);

}
}

/* --------------------------------------------------------- */

function drawPath(x, y) {

const px = x * TILE;
const py = y * TILE;

ctx.fillStyle = "#030303";

ctx.fillRect(
px,
py,
TILE,
TILE
);

ctx.fillStyle = "#171717";

if ((x + y) % 3 === 0) {

ctx.fillRect(
  px + 5,
  py + 5,
  2,
  2
);

}
}

/* ---------------------------------------------------------
ピンク＋黄緑ストライプ
--------------------------------------------------------- */

function drawWall(x, y) {

const px = x * TILE;
const py = y * TILE;

ctx.fillStyle = C.pink;

ctx.fillRect(
px,
py,
TILE,
TILE
);

ctx.save();

ctx.beginPath();

ctx.rect(
px,
py,
TILE,
TILE
);

ctx.clip();

ctx.fillStyle = C.green;

for (
let i = -TILE;
i < TILE * 2;
i += 10
) {

ctx.beginPath();

ctx.moveTo(px + i, py);
ctx.lineTo(px + i + 7, py);
ctx.lineTo(
  px + i - 10 + TILE,
  py + TILE
);
ctx.lineTo(
  px + i - 17 + TILE,
  py + TILE
);

ctx.fill();

}

ctx.restore();

ctx.fillStyle = "rgba(0,0,0,.25)";

ctx.fillRect(
px,
py,
TILE,
3
);

ctx.fillRect(
px,
py,
3,
TILE
);

ctx.fillStyle = "rgba(255,255,255,.2)";

ctx.fillRect(
px + 5,
py + 5,
3,
3
);
}

/* ---------------------------------------------------------
ゴール
--------------------------------------------------------- */

function drawGoal() {

const px = goal.x * TILE;
const py = goal.y * TILE;

const blink =
Math.floor(animationTime / 180) % 2 === 0;

ctx.fillStyle =
blink ? C.green : C.white;

ctx.fillRect(
px + 5,
py + 3,
22,
5
);

ctx.fillRect(
px + 4,
py + 8,
5,
20
);

ctx.fillRect(
px + 23,
py + 8,
5,
20
);

ctx.fillStyle = C.pink;

ctx.fillRect(
px + 9,
py + 12,
14,
14
);

ctx.fillStyle = C.black;

ctx.fillRect(
px + 12,
py + 15,
8,
11
);
}

/* ---------------------------------------------------------
アイテム
--------------------------------------------------------- */

function drawItems() {

for (const item of items) {

if (item.collected) continue;

const cx =
  item.x * TILE + TILE / 2;

const cy =
  item.y * TILE + TILE / 2;

const bounce =
  Math.sin(
    animationTime / 100 + item.x
  ) * 3;

if (item.type === "star") {

  drawStar(
    cx,
    cy + bounce
  );

} else {

  ctx.fillStyle = C.blue;

  ctx.fillRect(
    cx - 7,
    cy - 9 + bounce,
    14,
    18
  );

  ctx.fillStyle = C.white;

  ctx.fillRect(
    cx - 3,
    cy - 6 + bounce,
    4,
    4
  );

  ctx.fillStyle = C.purple;

  ctx.fillRect(
    cx - 4,
    cy + 4 + bounce,
    8,
    5
  );
}

}
}

/* --------------------------------------------------------- */

function drawStar(cx, cy) {

ctx.fillStyle = C.green;

ctx.fillRect(
cx - 3,
cy - 12,
6,
24
);

ctx.fillRect(
cx - 12,
cy - 3,
24,
6
);

ctx.fillRect(
cx - 8,
cy - 8,
6,
6
);

ctx.fillRect(
cx + 2,
cy - 8,
6,
6
);

ctx.fillRect(
cx - 8,
cy + 2,
6,
6
);

ctx.fillRect(
cx + 2,
cy + 2,
6,
6
);

ctx.fillStyle = C.white;

ctx.fillRect(
cx - 2,
cy - 2,
4,
4
);
}

/* ---------------------------------------------------------
敵
--------------------------------------------------------- */

function drawEnemies() {

for (const enemy of enemies) {

const px = enemy.x * TILE;
const py = enemy.y * TILE;

ctx.fillStyle = "#3a102c";

ctx.fillRect(
  px + 5,
  py + 25,
  22,
  5
);

ctx.fillStyle = C.red;

ctx.fillRect(
  px + 7,
  py + 7,
  18,
  18
);

ctx.fillRect(
  px + 4,
  py + 13,
  24,
  9
);

ctx.fillRect(
  px + 4,
  py + 7,
  5,
  7
);

ctx.fillRect(
  px + 23,
  py + 7,
  5,
  7
);

ctx.fillStyle = C.white;

ctx.fillRect(
  px + 9,
  py + 12,
  5,
  5
);

ctx.fillRect(
  px + 18,
  py + 12,
  5,
  5
);

ctx.fillStyle = C.black;

ctx.fillRect(
  px + 11,
  py + 14,
  3,
  3
);

ctx.fillRect(
  px + 20,
  py + 14,
  3,
  3
);

ctx.fillStyle = C.purple;

ctx.fillRect(

  py + 23,

);

ctx.fillRect(
  px + 19,
  py + 23,
  6,
  5

}
}

/* ---------------------------------------------------------
プレイヤー
--------------------------------------------------------- */

function drawPlayer() {

const px = player.x * TILE;
const py = player.y * TILE;

const bob =
Math.floor(animationTime / 130) % 2
? -2
: 0;

/* 影 */

ctx.fillStyle = "#42102f";

ctx.fillRect(
px + 5,
py + 27,
22,
4

/* 帽子 */

ctx.fillStyle = C.green;

/* 髪 */

ctx.fillStyle = C.purple;

);

ctx.fillRect(

/* 目 */

ctx.fillStyle = C.black;

if (player.dir === "left") {

ctx.fillRect(
  px + 9,
  py + 15 + bob,
  3,
  3
);

} else {

ctx.fillRect(
  px + 20,
  py + 15 + bob,
  3,
  3
);

}

/* 足 */

ctx.fillStyle = C.white;

ctx.fillRect(
px + 7,
py + 27 + bob,
7,
3
);

ctx.fillRect(
px + 19,
py + 27 + bob,

3

}

/* ---------------------------------------------------------
HUD
--------------------------------------------------------- */

function updateHUD() {

document.getElementById("stage").textContent =
currentStage + 1;

document.getElementById("score").textContent =
String(score).padStart(6, "0");

document.getElementById("lives").textContent =
lives;
}

/* ---------------------------------------------------------
フラッシュメッセージ
--------------------------------------------------------- */

function showFlash(text, color) {

const old =
document.getElementById("flash");

if (old) old.remove();

const div =
document.createElement("div");

div.id = "flash";

div.textContent = text;

div.style.color = color;

document
.getElementById("screen")
.appendChild(div);

setTimeout(function() {

div.remove();

}, 600);
}

/* ---------------------------------------------------------
ゲームループ
--------------------------------------------------------- */

let lastTime = 0;

function gameLoop(time) {

const dt = time - lastTime;

lastTime = time;

animationTime += dt;

if (running) {

processKeys();

enemyTimer += dt;

if (enemyTimer > 450) {

  enemyTimer = 0;

  updateEnemies();
}

}

draw();

if (running) {

requestAnimationFrame(gameLoop);

}
}
