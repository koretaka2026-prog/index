<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Count sheep</title>
    <!-- Google Fonts for gentle typography -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Zen Maru Gothic', sans-serif;
            background: #0f172a;
        }

        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
        }

        /* Sky Layer with smooth CSS transition */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 68%;
            background: linear-gradient(to bottom, #7dd3fc, #bae6fd, #e0f2fe);
            transition: background 0.5s ease-out;
            z-index: 1;
        }

        /* Starry sky layer for night */
        .stars-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 68%;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s ease-out;
            pointer-events: none;
        }

        /* Soft Drifting Clouds */
        .cloud {
            position: absolute;
            background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.7) 60%, rgba(255,255,255,0) 100%);
            border-radius: 100px;
            filter: blur(4px);
            animation: floatCloud linear infinite;
            z-index: 3;
            pointer-events: none;
        }
        @keyframes floatCloud {
            from { transform: translateX(-200px); }
            to { transform: translateX(calc(100vw + 200px)); }
        }

        /* Realistic Multi-layered Meadow */
        .meadow-back {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 36%;
            background: linear-gradient(to bottom, #86efac, #4ade80);
            transition: background 0.5s ease-out;
            z-index: 4;
            border-radius: 50% 50% 0 0 / 15% 15% 0 0;
        }
        .meadow-front {
            position: absolute;
            bottom: -20px;
            left: -5%;
            width: 110%;
            height: 28%;
            background: linear-gradient(to bottom, #22c55e, #15803d);
            transition: background 0.5s ease-out;
            z-index: 6;
            border-radius: 50% 50% 0 0 / 25% 25% 0 0;
            box-shadow: inset 0 15px 25px rgba(0,0,0,0.15);
        }

        /* Wooden Fence (Centered) */
        .fence-container {
            position: absolute;
            bottom: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 90px;
            z-index: 5;
            pointer-events: none;
        }

        /* Header UI (Guidance Message - Enlarged) */
        .header-panel {
            position: relative;
            z-index: 20;
            margin-top: 45px;
            text-align: center;
            pointer-events: none;
        }
        .message-display {
            font-size: 1.3rem;
            color: #1e293b;
            opacity: 0.9;
            height: 1.8em;
            text-shadow: 0 1px 3px rgba(255,255,255,0.7);
            font-weight: 700;
        }

        /* Realistic High-Quality Graphic */
        .animal {
            position: absolute;
            bottom: 24%;
            width: 90px;
            height: 70px;
            z-index: 5;
            cursor: pointer;
            will-change: transform, left, bottom;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.18));
            transition: transform 0.1s ease;
        }
        .animal:hover {
            transform: scale(1.05);
        }

        /* 巨大羊サイズ調整 */
        .animal.giant {
            width: 270px;
            height: 210px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.25));
            z-index: 7;
        }
        .animal.giant:hover {
            transform: scale(1.03);
        }

        /* 超巨大羊サイズ調整 (さらにデカい) */
        .animal.super-giant {
            width: 420px;
            height: 330px;
            filter: drop-shadow(0 20px 35px rgba(0,0,0,0.3));
            z-index: 8;
        }
        .animal.super-giant:hover {
            transform: scale(1.02);
        }

        /* 驚いたときのぷるぷるアニメーション */
        @keyframes surpriseShake {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            20% { transform: translate(-3px, -8px) rotate(-8deg) scale(1.1); }
            40% { transform: translate(3px, 4px) rotate(8deg) scale(1.1); }
            60% { transform: translate(-3px, -4px) rotate(-4deg) scale(1.1); }
            80% { transform: translate(3px, 2px) rotate(4deg) scale(1.05); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); }
        }
        .animal.surprised {
            animation: surpriseShake 0.3s ease infinite !important;
        }

        /* ダッシュ中のバウンドアニメーション */
        @keyframes dashBounce {
            0%, 100% { transform: translateY(0) scale(1, 0.95); }
            50% { transform: translateY(-8px) scale(0.95, 1.05); }
        }
        .animal.dashing {
            animation: dashBounce 0.2s ease infinite !important;
        }

        /* 吹き出しのアニメーション */
        @keyframes speechBubblePop {
            0% {
                opacity: 0;
                transform: translate(-50%, 12px) scale(0.6);
            }
            20% {
                opacity: 1;
                transform: translate(-50%, 0) scale(1.05);
            }
            30% {
                transform: translate(-50%, 0) scale(1);
            }
            85% {
                opacity: 1;
                transform: translate(-50%, -12px) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -24px) scale(0.9);
            }
        }

        .speech-bubble {
            position: absolute;
            bottom: 78px;
            left: 45px;
            background: #ffffff;
            color: #0f172a;
            font-size: 1.15rem;
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            white-space: nowrap;
            pointer-events: none;
            z-index: 10;
            animation: speechBubblePop 2.2s ease forwards;
            border: 2px solid #e2e8f0;
            letter-spacing: 0.03em;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 7px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }

        .animal.giant .speech-bubble {
            bottom: 220px;
            left: 135px;
            font-size: 1.6rem;
            padding: 12px 24px;
        }

        .animal.super-giant .speech-bubble {
            bottom: 340px;
            left: 210px;
            font-size: 2rem;
            padding: 16px 32px;
        }
    </style>
</head>
<body id="body">

    <div id="app-container" onclick="handleBackgroundClick(event)">
        <!-- Header Panel (Guidance only) -->
        <div class="header-panel">
            <div class="message-display" id="message"></div>
        </div>

        <!-- Sky and Stars -->
        <div class="sky" id="sky"></div>
        <canvas class="stars-canvas" id="starsCanvas"></canvas>

        <!-- Wooden Fence SVG -->
        <div class="fence-container">
            <svg width="160" height="90" viewBox="0 0 160 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Posts -->
                <rect x="15" y="5" width="16" height="85" rx="4" fill="url(#woodGrad)" stroke="#451a03" stroke-width="1.5"/>
                <rect x="72" y="2" width="16" height="88" rx="4" fill="url(#woodGrad)" stroke="#451a03" stroke-width="1.5"/>
                <rect x="129" y="5" width="16" height="85" rx="4" fill="url(#woodGrad)" stroke="#451a03" stroke-width="1.5"/>
                <!-- Rails -->
                <rect x="5" y="22" width="150" height="12" rx="3" fill="url(#woodGradRail)" stroke="#451a03" stroke-width="1.5"/>
                <rect x="5" y="58" width="150" height="12" rx="3" fill="url(#woodGradRail)" stroke="#451a03" stroke-width="1.5"/>
                <line x1="20" y1="10" x2="20" y2="80" stroke="#78350f" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                <line x1="77" y1="8" x2="77" y2="82" stroke="#78350f" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                <line x1="134" y1="10" x2="134" y2="80" stroke="#78350f" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                
                <defs>
                    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#92400e"/>
                        <stop offset="50%" stop-color="#b45309"/>
                        <stop offset="100%" stop-color="#78350f"/>
                    </linearGradient>
                    <linearGradient id="woodGradRail" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#b45309"/>
                        <stop offset="50%" stop-color="#92400e"/>
                        <stop offset="100%" stop-color="#78350f"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <!-- Layered Meadows -->
        <div class="meadow-back" id="meadowBack"></div>
        <div class="meadow-front" id="meadowFront"></div>
    </div>

    <script>
        /* --- Starry Sky Setup --- */
        const starsCanvas = document.getElementById('starsCanvas');
        const sCtx = starsCanvas.getContext('2d');
        let stars = [];

        function resizeStars() {
            starsCanvas.width = window.innerWidth;
            starsCanvas.height = window.innerHeight * 0.68;
            initStars();
        }

        function initStars() {
            stars = [];
            const count = Math.floor((starsCanvas.width * starsCanvas.height) / 3500);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * starsCanvas.width,
                    y: Math.random() * starsCanvas.height,
                    radius: Math.random() * 1.5 + 0.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.005
                });
            }
        }
        window.addEventListener('resize', resizeStars);
        resizeStars();

        function drawStars(nightProgress) {
            sCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
            if (nightProgress <= 0) return;
            
            sCtx.fillStyle = `rgba(255, 255, 255, ${nightProgress})`;
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0.2) star.speed *= -1;
                sCtx.globalAlpha = star.alpha * nightProgress;
                sCtx.beginPath();
                sCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                sCtx.fill();
            });
            sCtx.globalAlpha = 1.0;
        }

        /* --- Cloud Generation --- */
        const skyEl = document.getElementById('sky');
        function createClouds() {
            for (let i = 0; i < 5; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                const width = 120 + Math.random() * 100;
                const height = 40 + Math.random() * 25;
                cloud.style.width = `${width}px`;
                cloud.style.height = `${height}px`;
                cloud.style.top = `${Math.random() * 50}%`;
                cloud.style.left = `${Math.random() * -200}px`;
                const duration = 40 + Math.random() * 30;
                cloud.style.animationDuration = `${duration}s`;
                cloud.style.animationDelay = `${Math.random() * duration}s`;
                skyEl.appendChild(cloud);
            }
        }
        createClouds();

        /* --- Smooth Color Cycle --- */
        const skyStages = [
            { r: 253, g: 186, b: 116 }, // 夕方
            { r: 125, g: 211, b: 252 }, // 昼
            { r: 244, g: 63,  b: 94  }, // 夕暮れ
            { r: 15,  g: 23,  b: 42  }  // 夜
        ];

        const meadowBackStages = [
            { r: 134, g: 239, b: 172 },
            { r: 134, g: 239, b: 172 },
            { r: 180, g: 83,  b: 9   },
            { r: 15,  g: 23,  b: 42  }
        ];

        const meadowFrontStages = [
            { r: 34,  g: 197, b: 94  },
            { r: 34,  g: 197, b: 94  },
            { r: 120, g: 53,  b: 15  },
            { r: 5,   g: 46,  b: 22  }
        ];

        let cycleProgress = 0;
        const cycleDuration = 120000; // 1周2分
        let lastTime = performance.now();

        function updateEnvironment(currentTime) {
            const dt = currentTime - lastTime;
            lastTime = currentTime;
            cycleProgress = (cycleProgress + dt / cycleDuration) % 1;

            const totalStages = skyStages.length;
            const scaled = cycleProgress * totalStages;
            const index = Math.floor(scaled);
            const nextIndex = (index + 1) % totalStages;
            const factor = scaled - index;

            const skyColor = interpolateColor(skyStages[index], skyStages[nextIndex], factor);
            const medBackColor = interpolateColor(meadowBackStages[index], meadowBackStages[nextIndex], factor);
            const medFrontColor = interpolateColor(meadowFrontStages[index], meadowFrontStages[nextIndex], factor);

            skyEl.style.background = `linear-gradient(to bottom, rgb(${skyColor.r}, ${skyColor.g}, ${skyColor.b}), rgba(${skyColor.r}, ${skyColor.g}, ${skyColor.b}, 0.85))`;
            document.getElementById('meadowBack').style.background = `linear-gradient(to bottom, rgb(${medBackColor.r}, ${medBackColor.g}, ${medBackColor.b}), rgba(${medBackColor.r}, ${medBackColor.g}, ${medBackColor.b}, 0.9))`;
            document.getElementById('meadowFront').style.background = `linear-gradient(to bottom, rgb(${medFrontColor.r}, ${medFrontColor.g}, ${medFrontColor.b}), rgb(${medFrontColor.r * 0.7}, ${medFrontColor.g * 0.7}, ${medFrontColor.b * 0.7}))`;

            let nightFactor = 0;
            if (index === 3) nightFactor = 1 - factor;
            if (index === 2) nightFactor = factor;
            drawStars(nightFactor);

            requestAnimationFrame(updateEnvironment);
        }
        requestAnimationFrame(updateEnvironment);

        function interpolateColor(c1, c2, factor) {
            return {
                r: Math.round(c1.r + (c2.r - c1.r) * factor),
                g: Math.round(c1.g + (c2.g - c1.g) * factor),
                b: Math.round(c1.b + (c2.b - c1.b) * factor)
            };
        }

        /* --- Animal Simulation & Interaction Logic --- */
        let sheepCount = 0;
        let pigCount = 0;
        let horseCount = 0;
        const messageEl = document.getElementById('message');
        const appContainer = document.getElementById('app-container');

        setInterval(() => {
            spawnAnimal();
        }, 6000);

        function handleBackgroundClick(event) {
            spawnAnimal();
        }

        function spawnAnimal() {
            const screenWidth = window.innerWidth;
            const startX = -200;
            const endX = screenWidth + 200;

            const animal = document.createElement('div');
            animal.className = 'animal';
            animal.style.left = `${startX}px`;

            let duration = 7500 + Math.random() * 3000;
            const jumpHeight = 120 + Math.random() * 40;
            const jumpCenterOffset = (Math.random() - 0.5) * 0.06;
            const jumpStart = 0.35 + jumpCenterOffset;
            const jumpEnd = jumpStart + 0.24;
            const jumpPeak = jumpStart + 0.12;

            // 確率判定
            const isSuperGiantSheep = Math.random() < 0.0001; // 1万分の1
            const isGiantSheep = !isSuperGiantSheep && (Math.random() < 0.001); // 千分の1
            const isStumbler = !isSuperGiantSheep && !isGiantSheep && (Math.random() < 0.002); // 500分の1 (0.2%)

            let animalType = 'sheep';
            if (isSuperGiantSheep) {
                animalType = 'superGiantSheep';
                animal.classList.add('super-giant');
                duration = 14000;
            } else if (isGiantSheep) {
                animalType = 'giantSheep';
                animal.classList.add('giant');
                duration = 11000;
            } else {
                const randType = Math.random();
                if (randType < 0.005) {
                    animalType = 'horse';
                } else if (randType < 0.015) {
                    animalType = 'pig';
                }
            }

            if (isStumbler) {
                animal.isStumbler = true;
            }

            let animalInnerSvg = '';

            if (animalType === 'superGiantSheep') {
                animal.animalType = 'superGiantSheep';
                animalInnerSvg = `
                    <svg width="420" height="330" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="50" cy="48" rx="30" ry="22" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
                        <circle cx="32" cy="38" r="13" fill="#FFFFFF"/>
                        <circle cx="62" cy="36" r="14" fill="#FFFFFF"/>
                        <circle cx="48" cy="30" r="15" fill="#FFFFFF"/>
                        <circle cx="34" cy="54" r="13" fill="#FFFFFF"/>
                        <circle cx="64" cy="52" r="13" fill="#FFFFFF"/>
                        <circle cx="25" cy="45" r="10" fill="#FFFFFF"/>
                        <rect x="32" y="64" width="6" height="13" rx="3" fill="#0F172A"/>
                        <rect x="42" y="66" width="6" height="11" rx="3" fill="#0F172A"/>
                        <rect x="58" y="66" width="6" height="11" rx="3" fill="#0F172A"/>
                        <rect x="68" y="64" width="6" height="13" rx="3" fill="#0F172A"/>
                        <ellipse cx="78" cy="40" rx="11" ry="10" fill="#0F172A"/>
                        <ellipse cx="85" cy="42" rx="5" ry="6" fill="#020617"/>
                        <path d="M83 39 Q85 41 87 39" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round"/>
                        <ellipse cx="73" cy="32" rx="4" ry="7" transform="rotate(25 73 32)" fill="#0F172A"/>
                        <path d="M70 26 L74 17 L78 23 L82 15 L86 23 L90 17 L94 26 Z" fill="#FACC15" stroke="#EAB308" stroke-width="1"/>
                        <circle cx="74" cy="16" r="2" fill="#EF4444"/>
                        <circle cx="82" cy="14" r="2.5" fill="#3B82F6"/>
                        <circle cx="90" cy="16" r="2" fill="#10B981"/>
                        <text x="70" y="11" fill="#FDE047" font-size="7" font-weight="bold" font-family="sans-serif">🌟 SUPREME 🌟</text>
                    </svg>
                `;
            } else if (animalType === 'giantSheep') {
                animal.animalType = 'giantSheep';
                animalInnerSvg = `
                    <svg width="270" height="210" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="50" cy="48" rx="30" ry="22" fill="#EEF2F6" stroke="#94A3B8" stroke-width="1.5"/>
                        <circle cx="32" cy="38" r="13" fill="#EEF2F6"/>
                        <circle cx="62" cy="36" r="14" fill="#EEF2F6"/>
                        <circle cx="48" cy="30" r="15" fill="#EEF2F6"/>
                        <circle cx="34" cy="54" r="13" fill="#EEF2F6"/>
                        <circle cx="64" cy="52" r="13" fill="#EEF2F6"/>
                        <circle cx="25" cy="45" r="10" fill="#EEF2F6"/>
                        <rect x="32" y="64" width="6" height="13" rx="3" fill="#1E293B"/>
                        <rect x="42" y="66" width="6" height="11" rx="3" fill="#1E293B"/>
                        <rect x="58" y="66" width="6" height="11" rx="3" fill="#1E293B"/>
                        <rect x="68" y="64" width="6" height="13" rx="3" fill="#1E293B"/>
                        <ellipse cx="78" cy="40" rx="11" ry="10" fill="#0F172A"/>
                        <ellipse cx="85" cy="42" rx="5" ry="6" fill="#020617"/>
                        <path d="M83 39 Q85 41 87 39" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round"/>
                        <ellipse cx="73" cy="32" rx="4" ry="7" transform="rotate(25 73 32)" fill="#1E293B"/>
                        <path d="M72 26 L75 19 L78 24 L82 18 L86 24 L89 19 L92 26 Z" fill="#FACC15" stroke="#CA8A04" stroke-width="1"/>
                        <circle cx="75" cy="18" r="1.5" fill="#EF4444"/>
                        <circle cx="82" cy="17" r="1.5" fill="#3B82F6"/>
                        <circle cx="89" cy="18" r="1.5" fill="#10B981"/>
                        <text x="75" y="14" fill="#EAB308" font-size="8" font-weight="bold" font-family="sans-serif">👑KING</text>
                    </svg>
                `;
            } else if (animalType === 'horse') {
                animal.animalType = 'horse';
                animalInnerSvg = `
                    <svg width="100" height="75" viewBox="0 0 110 85" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="55" cy="52" rx="30" ry="18" fill="#B45309" stroke="#78350F" stroke-width="1.5"/>
                        <rect x="35" y="66" width="6" height="15" rx="3" fill="#78350F"/>
                        <rect x="45" y="66" width="6" height="15" rx="3" fill="#78350F"/>
                        <rect x="62" y="66" width="6" height="15" rx="3" fill="#78350F"/>
                        <rect x="72" y="66" width="6" height="15" rx="3" fill="#78350F"/>
                        <path d="M72 48 L86 28 L94 32 L80 54 Z" fill="#B45309" stroke="#78350F" stroke-width="1.5"/>
                        <ellipse cx="90" cy="28" rx="10" ry="7" transform="rotate(20 90 28)" fill="#B45309" stroke="#78350F" stroke-width="1.5"/>
                        <path d="M74 42 L80 32 L78 50 Z" fill="#451A03"/>
                        <path d="M84 22 L88 27 L82 27 Z" fill="#78350F"/>
                        <circle cx="93" cy="26" r="1.5" fill="#1F2937"/>
                        <text x="80" y="16" fill="#B45309" font-size="9" font-weight="bold" font-family="sans-serif">ヒヒーン</text>
                    </svg>
                `;
            } else if (animalType === 'pig') {
                animal.animalType = 'pig';
                animalInnerSvg = `
                    <svg width="90" height="70" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="50" cy="50" rx="32" ry="24" fill="#F472B6" stroke="#DB2777" stroke-width="1.5"/>
                        <circle cx="28" cy="38" r="8" fill="#F472B6"/>
                        <circle cx="72" cy="38" r="8" fill="#F472B6"/>
                        <rect x="30" y="66" width="6" height="11" rx="3" fill="#BE185D"/>
                        <rect x="42" y="68" width="6" height="9" rx="3" fill="#BE185D"/>
                        <rect x="54" y="68" width="6" height="9" rx="3" fill="#BE185D"/>
                        <rect x="66" y="66" width="6" height="11" rx="3" fill="#BE185D"/>
                        <ellipse cx="78" cy="46" rx="13" ry="12" fill="#F472B6" stroke="#DB2777" stroke-width="1.5"/>
                        <ellipse cx="84" cy="48" rx="6" ry="4" fill="#FB7185" stroke="#E11D48" stroke-width="1"/>
                        <circle cx="82" cy="47" r="0.8" fill="#881337"/>
                        <circle cx="86" cy="47" r="0.8" fill="#881337"/>
                        <circle cx="82" cy="40" r="1.5" fill="#881337"/>
                        <path d="M70 34 L78 27 L74 37 Z" fill="#DB2777"/>
                        <path d="M84 33 L89 25 L83 34 Z" fill="#DB2777"/>
                        <text x="83" y="24" fill="#DB2777" font-size="9" font-family="sans-serif">ブヒ</text>
                    </svg>
                `;
            } else {
                animal.animalType = 'sheep';
                const isRare = Math.random() < (1 / 15);
                if (isRare) {
                    animalInnerSvg = `
                        <svg width="90" height="70" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <ellipse cx="50" cy="48" rx="30" ry="22" fill="#FEF08A" stroke="#EAB308" stroke-width="1.5"/>
                            <circle cx="32" cy="38" r="13" fill="#FEF08A"/><circle cx="62" cy="36" r="14" fill="#FEF08A"/>
                            <circle cx="48" cy="30" r="15" fill="#FEF08A"/><circle cx="34" cy="54" r="13" fill="#FEF08A"/>
                            <circle cx="64" cy="52" r="13" fill="#FEF08A"/><circle cx="25" cy="45" r="10" fill="#FEF08A"/>
                            <path d="M45 20 L47 25 L52 27 L47 29 L45 34 L43 29 L38 27 L43 25 Z" fill="#FACC15"/>
                            <rect x="32" y="64" width="6" height="13" rx="3" fill="#713F12"/>
                            <rect x="42" y="66" width="6" height="11" rx="3" fill="#713F12"/>
                            <rect x="58" y="66" width="6" height="11" rx="3" fill="#713F12"/>
                            <rect x="68" y="64" width="6" height="13" rx="3" fill="#713F12"/>
                            <ellipse cx="78" cy="40" rx="11" ry="10" fill="#78350F"/>
                            <ellipse cx="85" cy="42" rx="5" ry="6" fill="#451A03"/>
                            <path d="M83 39 Q85 41 87 39" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round"/>
                            <ellipse cx="73" cy="32" rx="4" ry="7" transform="rotate(25 73 32)" fill="#92400E"/>
                            <text x="82" y="24" fill="#EAB308" font-size="10" font-family="sans-serif">★</text>
                        </svg>`;
                } else {
                    animalInnerSvg = `
                        <svg width="90" height="70" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <ellipse cx="50" cy="48" rx="30" ry="22" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
                            <circle cx="32" cy="38" r="13" fill="#F8FAFC"/>
                            <circle cx="62" cy="36" r="14" fill="#F8FAFC"/>
                            <circle cx="48" cy="30" r="15" fill="#F8FAFC"/>
                            <circle cx="34" cy="54" r="13" fill="#F8FAFC"/>
                            <circle cx="64" cy="52" r="13" fill="#F8FAFC"/>
                            <circle cx="25" cy="45" r="10" fill="#F8FAFC"/>
                            <circle cx="45" cy="36" r="6" fill="#FFFFFF"/>
                            <circle cx="58" cy="44" r="7" fill="#FFFFFF"/>
                            <rect x="32" y="64" width="6" height="13" rx="3" fill="#334155"/>
                            <rect x="42" y="66" width="6" height="11" rx="3" fill="#334155"/>
                            <rect x="58" y="66" width="6" height="11" rx="3" fill="#334155"/>
                            <rect x="68" y="64" width="6" height="13" rx="3" fill="#334155"/>
                            <ellipse cx="78" cy="40" rx="11" ry="10" fill="#1E293B"/>
                            <ellipse cx="85" cy="42" rx="5" ry="6" fill="#0F172A"/>
                            <path d="M83 39 Q85 41 87 39" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
                            <ellipse cx="73" cy="32" rx="4" ry="7" transform="rotate(25 73 32)" fill="#334155"/>
                            <ellipse cx="73" cy="32" rx="2" ry="5" transform="rotate(25 73 32)" fill="#CBD5E1"/>
                            <text x="82" y="24" fill="#64748B" font-size="10" font-family="sans-serif" opacity="0.8">z</text>
                        </svg>
                    `;
                }
            }

            animal.innerHTML = animalInnerSvg;
            appContainer.appendChild(animal);

            let isInteracted = false;

            animal.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isInteracted) return;
                isInteracted = true;

                const actionType = Math.random() < 0.5 ? 'flyOut' : 'dash';

                if (actionType === 'flyOut') {
                    animal.classList.add('surprised');
                    setReactionMessage(animal.animalType, 'flyOut');

                    const clickFlyTime = performance.now();
                    const startFlyBottom = parseFloat(animal.style.bottom);
                    const startFlyLeft = parseFloat(animal.style.left);

                    function animateUpwardFlight(time) {
                        const elapsed = time - clickFlyTime;
                        const progress = elapsed / 600;

                        if (progress < 1) {
                            const upwardOffset = Math.sin(progress * Math.PI * 0.5) * 350;
                            animal.style.bottom = `${startFlyBottom + upwardOffset}px`;
                            animal.style.left = `${startFlyLeft + progress * 80}px`;
                            animal.style.transform = `rotate(${progress * 720}deg) scale(${1 - progress * 0.3})`;
                            requestAnimationFrame(animateUpwardFlight);
                        } else {
                            animal.remove();
                        }
                    }
                    requestAnimationFrame(animateUpwardFlight);

                } else {
                    animal.classList.add('dashing');
                    setReactionMessage(animal.animalType, 'dash');

                    const remainingProgress = currentProgress;
                    const dashStartTime = performance.now();
                    const startDashX = parseFloat(animal.style.left);
                    const dashDuration = (1 - remainingProgress) * 2000;

                    function animateDash(time) {
                        const elapsed = time - dashStartTime;
                        const progress = Math.min(elapsed / dashDuration, 1);

                        const currentX = startDashX + (endX - startDashX) * progress;
                        animal.style.left = `${currentX}px`;
                        animal.style.bottom = `24%`;

                        if (progress < 1) {
                            requestAnimationFrame(animateDash);
                        } else {
                            animal.remove();
                        }
                    }
                    currentProgress = 2.0;
                    requestAnimationFrame(animateDash);
                }
            });

            const startTime = performance.now();
            let currentProgress = 0;

            function animateAnimal(currentTime) {
                if (isInteracted && currentProgress >= 2.0) return;
                if (isInteracted) return;

                const elapsed = currentTime - startTime;
                currentProgress = Math.min(elapsed / duration, 1);

                const currentX = startX + (endX - startX) * currentProgress;
                
                let verticalOffset = 0;
                let tiltAngle = (Math.sin(currentProgress * Math.PI * 12) * 3);

                // つまずきアニメーション（中央付近 = progress 0.45〜0.55）
                let stumbleExtraAngle = 0;
                let stumbleOffsetY = 0;
                if (animal.isStumbler && currentProgress >= 0.45 && currentProgress <= 0.60) {
                    const stProg = (currentProgress - 0.45) / 0.15; // 0 to 1
                    if (stProg < 0.4) {
                        stumbleExtraAngle = -45 * (stProg / 0.4);
                        stumbleOffsetY = -15 * (stProg / 0.4);
                    } else if (stProg < 0.7) {
                        stumbleExtraAngle = -45 + (Math.sin(stProg * Math.PI * 15) * 5);
                        stumbleOffsetY = -15;
                    } else {
                        const recoverProg = (stProg - 0.7) / 0.3;
                        stumbleExtraAngle = -45 * (1 - recoverProg);
                        stumbleOffsetY = -15 * (1 - recoverProg);
                    }
                }

                if (currentProgress >= jumpStart && currentProgress <= jumpEnd) {
                    const jumpProgress = (currentProgress - jumpStart) / (jumpEnd - jumpStart);
                    verticalOffset = Math.sin(jumpProgress * Math.PI) * jumpHeight;
                    tiltAngle = (jumpProgress - 0.5) * 40;
                }

                animal.style.left = `${currentX}px`;
                animal.style.bottom = `${24 + (verticalOffset / window.innerHeight) * 100 + stumbleOffsetY}%`;
                animal.style.transform = `rotate(${tiltAngle + stumbleExtraAngle}deg)`;

                if (currentProgress >= jumpPeak && !animal.hasCounted) {
                    animal.hasCounted = true;
                    if (animal.isStumbler) {
                        showSpeechBubble(animal, 'stumble');
                        messageEl.textContent = "「いてっ…！柵につまずいてしまった…」";
                    } else if (animal.animalType === 'superGiantSheep') {
                        showSpeechBubble(animal, 'superGiantSheep');
                        messageEl.textContent = "「……ゴゴゴゴ…（究極の超巨大羊が現れた…！）」";
                    } else if (animal.animalType === 'giantSheep') {
                        showSpeechBubble(animal, 'giantSheep');
                        messageEl.textContent = "「……ゴゴゴ…（伝説の巨大羊が現れた！）」";
                    } else if (animal.animalType === 'horse') {
                        horseCount++;
                        showSpeechBubble(animal, 'horse');
                    } else if (animal.animalType === 'pig') {
                        pigCount++;
                        showSpeechBubble(animal, 'pig');
                    } else {
                        sheepCount++;
                        showSpeechBubble(animal, 'sheep');
                        updateMessage();
                    }
                }

                if (currentProgress < 1) {
                    requestAnimationFrame(animateAnimal);
                } else {
                    animal.remove();
                }
            }

            requestAnimationFrame(animateAnimal);
        }

        function setReactionMessage(type, action) {
            if (action === 'flyOut') {
                if (type === 'superGiantSheep') messageEl.textContent = "「モデーーーーーーッ！？（超巨大羊が空へ飛び立った！）」";
                else if (type === 'giantSheep') messageEl.textContent = "「モデーーッ！？（巨大羊が空へ飛び立った！）」";
                else if (type === 'horse') messageEl.textContent = "「ヒヒ〜ン！？（空へ飛び立った！）」";
                else if (type === 'pig') messageEl.textContent = "「ブヒッ！？（空へ飛び立った！）」";
                else messageEl.textContent = "「メェッ！？（空へ飛び立った！）」";
            } else {
                if (type === 'superGiantSheep') messageEl.textContent = "「モデーーーッ！超ド級ダッシュ！」";
                else if (type === 'giantSheep') messageEl.textContent = "「モデーーッ！超高速ダッシュ！」";
                else if (type === 'horse') messageEl.textContent = "「ヒヒ〜ン！ダッシュ！」";
                else if (type === 'pig') messageEl.textContent = "「ブヒッ！ダッシュ！」";
                else messageEl.textContent = "「メェッ！ダッシュ！」";
            }
        }

        function showSpeechBubble(animalEl, type) {
            const bubble = document.createElement('div');
            bubble.className = 'speech-bubble';
            
            let randomText = '';
            if (type === 'stumble') {
                const stumblePatterns = [
                    `いてっ...`,
                    `つまずいちゃった...`,
                    `どてっ...`,
                    `あぶないあぶない...`
                ];
                randomText = stumblePatterns[Math.floor(Math.random() * stumblePatterns.length)];
            } else if (type === 'superGiantSheep') {
                const superGiantPatterns = [
                    `スプリームシープあらわる...！`,
                    `宇宙一のねむけ...`,
                    `もふもふの神...`,
                    `どどーん！`
                ];
                randomText = superGiantPatterns[Math.floor(Math.random() * superGiantPatterns.length)];
            } else if (type === 'giantSheep') {
                const giantPatterns = [
                    `キングシープあらわる...！`,
                    `ものすごく おおきい...`,
                    `1000ぴき分のねむけ...`,
                    `どーん！`
                ];
                randomText = giantPatterns[Math.floor(Math.random() * giantPatterns.length)];
            } else if (type === 'horse') {
                const horsePatterns = [
                    `うまが ${horseCount} とう`,
                    `うまが ${horseCount} ひき`,
                    `ウマが ${horseCount} 頭`,
                    `おうまさんが ${horseCount} とう`,
                    `うま... ${horseCount}とう...`
                ];
                randomText = horsePatterns[Math.floor(Math.random() * horsePatterns.length)];
            } else if (type === 'pig') {
                const pigPatterns = [
                    `ぶたが ${pigCount} ひき`,
                    `ぶたが ${pigCount} 匹`,
                    `ブタが ${pigCount} 頭`,
                    `ぶちゅじが ${pigCount} ひき...？`,
                    `ぶた... ${pigCount}ひき...`
                ];
                randomText = pigPatterns[Math.floor(Math.random() * pigPatterns.length)];
            } else {
                const sheepPatterns = [
                    `ひつじが ${sheepCount} ひき`,
                    `ひつじが ${sheepCount} 匹`,
                    `ひちゅじが ${sheepCount} ひき`,
                    `ひふじが ${sheepCount} ひき`,
                    `羊が ${sheepCount} ひき`,
                    `羊が ${sheepCount} 匹`,
                    `ひつじ... ${sheepCount}ひき...`
                ];
                randomText = sheepPatterns[Math.floor(Math.random() * sheepPatterns.length)];
            }

            bubble.textContent = randomText;
            animalEl.appendChild(bubble);

            setTimeout(() => {
                bubble.remove();
            }, 2200);
        }

        function updateMessage() {
            const messages = [
                "だんだんまぶたが重くなってきました...",
                "心地よい風が、心を穏やかにします...",
                "ゆっくり、深呼吸を繰り返しましょう...",
                "思考が静かに溶けていきます...",
                "そのまま、眠りの世界へ..."
            ];
            if (sheepCount % 5 === 0) {
                const index = (Math.floor(sheepCount / 5) - 1) % messages.length;
                messageEl.textContent = messages[index];
            } else {
                messageEl.textContent = "";
            }
        }
    </script>
</body>
</html>
