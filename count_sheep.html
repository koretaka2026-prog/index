<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Count sheep</title>
    <!-- Google Fonts for gentle typography -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body id="body">

    <div id="app-container" onclick="handleBackgroundClick(event)">
        <!-- Header Panel (Guidance only) -->
        <div class="header-panel">
            <div class="message-display" id="message"></div>
        </div>

        <!-- Sky and Stars -->
        <div class="sky" id="sky"></div>
        <canvas class="stars-canvas" id="starsCanvas"></canvas>

        <!-- Wooden Fence SVG (Clickable) -->
        <div class="fence-container" id="fenceContainer" onclick="handleFenceClick(event)">
            <svg id="fenceSvg" width="160" height="90" viewBox="0 0 160 90" fill="none" xmlns="http://www.w3.org/2000/svg" style="transition: height 0.3s ease;">
                <!-- Posts -->
                <rect id="post1" x="15" y="5" width="16" height="85" rx="4" fill="url(#woodGrad)" stroke="#451a03" stroke-width="1.5" style="transition: y 0.3s ease, height 0.3s ease;"/>
                <rect id="post2" x="72" y="2" width="16" height="88" rx="4" fill="url(#woodGrad)" stroke="#451a03" stroke-width="1.5" style="transition: y 0.3s ease, height 0.3s ease;"/>
                <rect id="post3" x="129" y="5" width="16" height="85" rx="4" fill="url(#woodGrad)" stroke="#451a03" stroke-width="1.5" style="transition: y 0.3s ease, height 0.3s ease;"/>
                <!-- Rails -->
                <rect id="rail1" x="5" y="22" width="150" height="12" rx="3" fill="url(#woodGradRail)" stroke="#451a03" stroke-width="1.5" style="transition: y 0.3s ease;"/>
                <rect id="rail2" x="5" y="58" width="150" height="12" rx="3" fill="url(#woodGradRail)" stroke="#451a03" stroke-width="1.5" style="transition: y 0.3s ease;"/>
                <line id="line1" x1="20" y1="10" x2="20" y2="80" stroke="#78350f" stroke-width="2" stroke-linecap="round" opacity="0.6" style="transition: y2 0.3s ease;"/>
                <line id="line2" x1="77" y1="8" x2="77" y2="82" stroke="#78350f" stroke-width="2" stroke-linecap="round" opacity="0.6" style="transition: y2 0.3s ease;"/>
                <line id="line3" x1="134" y1="10" x2="134" y2="80" stroke="#78350f" stroke-width="2" stroke-linecap="round" opacity="0.6" style="transition: y2 0.3s ease;"/>
                
                <defs>
                    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#92400e"/>
                        <stop offset="50%" stop-color="#b45309"/>
                        <stop offset="100%" stop-color="#78350f"/>
                    </linearGradient>
                    <linearGradient id="woodGradRail" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#b45309"/>
                        <stop offset="50%" stop-color="#92400e"/>
                        <stop offset="100%" stop-color="#78350f"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <!-- Layered Meadows -->
        <div class="meadow-back" id="meadowBack"></div>
        <div class="meadow-front" id="meadowFront"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
