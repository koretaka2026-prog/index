<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>アルティメット・バーチャル・ドラム &amp; 和太鼓スタジオ</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #d97706;
            --accent-hover: #b45309;
            --accent-active: #92400e;
            --danger: #ef4444;
            --border-color: #334155;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            touch-action: manipulation;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h1 {
            font-size: 1.2rem;
            background: linear-gradient(to right, #fef08a, #f59e0b, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        select, input[type="range"] {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            padding: 0.5rem;
            font-size: 0.85rem;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 0.5rem 0.8rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.97); }
        .btn-secondary { background: var(--border-color); color: var(--text-color); }
        .btn-secondary:hover { background: #475569; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #dc2626; }

        /* ドラムパッドグリッド */
        .drum-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .drum-pad {
            background: radial-gradient(circle at 30% 30%, #334155 0%, #1e293b 70%, #0f172a 100%);
            border: 3px solid #475569;
            border-radius: 50%;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 2px 5px rgba(255,255,255,0.2);
            transition: transform 0.05s ease, filter 0.05s ease;
        }

        .drum-pad.active, .drum-pad:active {
            transform: scale(0.92);
            filter: brightness(1.2);
            border-color: var(--accent-primary);
        }

        .drum-pad.cymbal {
            background: radial-gradient(circle at 35% 35%, #fef08a 0%, #eab308 40%, #854d0e 90%, #451a03 100%);
            border-color: #facc15;
        }

        .drum-pad.kick-pad {
            grid-column: span 3;
            border-radius: var(--radius);
            aspect-ratio: auto;
            height: 75px;
            background: radial-gradient(circle at 50% 30%, #475569 0%, #1e293b 70%);
        }

        .pad-name {
            font-size: 0.9rem;
            font-weight: 900;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            text-align: center;
            padding: 0 0.5rem;
        }

        .pad-hint {
            font-size: 0.65rem;
            background: rgba(0, 0, 0, 0.6);
            color: #fbbf24;
            padding: 0.1rem 0.4rem;
            border-radius: 10px;
            margin-top: 4px;
            font-family: monospace;
        }

        .info-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.4;
        }

        /* モーダル */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            z-index: 1000; padding: 1rem;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: var(--radius); width: 100%; max-width: 480px;
            max-height: 85vh; display: flex; flex-direction: column; padding: 1.25rem;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
        .modal-body { overflow-y: auto; font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-top">
            <h1>🥁 バーチャル・ドラムスタジオ</h1>
            <button id="btn-help" class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;">❓ ヘルプ</button>
        </div>
        <div class="controls-row">
            <select id="kit-select" style="flex: 1;">
                <option value="acoustic">🥁 アコースティック・ドラム</option>
                <option value="wadaiko">伝統和太鼓セット</option>
                <option value="cyber">⚡ エレクトロニック 808</option>
            </select>
            <div style="display: flex; align-items: center; gap: 0.3rem; font-size: 0.75rem; color: var(--text-muted);">
                <span>音量:</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.85" style="width: 80px;">
            </div>
        </div>
        <div class="controls-row" style="justify-content: space-between;">
            <div style="display: flex; gap: 0.4rem;">
                <button id="btn-metronome" class="btn btn-secondary">メトロノーム</button>
                <button id="btn-record" class="btn btn-danger">🔴 録音</button>
                <button id="btn-play" class="btn btn-secondary" disabled>▶ 再生</button>
            </div>
            <span id="record-status" style="font-size: 0.75rem; color: var(--text-muted);">待機中</span>
        </div>
    </header>

    <!-- ドラムパッド配置エリア -->
    <div id="drum-grid" class="drum-grid">
        <!-- JavaScriptで動的生成 -->
    </div>

    <div class="info-text">
        📱 パッドを素早く連打しても、画面が拡大しない安全設計になっています[cite: 2]。
    </div>
</div>

<!-- ヘルプモーダル -->
<div id="help-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>使い方・操作方法</h3>
            <button id="close-modal" class="btn btn-secondary" style="padding: 0.2rem 0.5rem;">&times;</button>
        </div>
        <div class="modal-body">
            <p><b>スマホ・タブレット:</b> 画面上のパッドをタップして演奏します。マルチタッチ対応で両手での連打も可能です。</p>
            <p style="margin-top: 0.5rem;"><b>PCでの演奏:</b> キーボードの数字キー (1〜8) や スペースキー でも演奏できます。</p>
            <p style="margin-top: 0.5rem;"><b>録音機能:</b> 🔴録音ボタンを押して演奏を記録し、▶再生ボタンでループ再生できます。</p>
        </div>
    </div>
</div>

<script>
    let audioCtx = null;
    let masterGain = null;

    // 音声コンテキストの初期化
    function initAudio() {
        if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContextClass();
            masterGain = audioCtx.createGain();
            masterGain.connect(audioCtx.destination);
            updateVolume();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function updateVolume() {
        if (masterGain && audioCtx) {
            const val = parseFloat(document.getElementById('volume-slider').value);
            masterGain.gain.setValueAtTime(val, audioCtx.currentTime);
        }
    }
    document.getElementById('volume-slider').addEventListener('input', updateVolume);

    // ドラム音源シンセサイザー（低音増強済み）
    function synthKick() {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.2);
        
        gain.gain.setValueAtTime(3.0, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now);
        osc.stop(now + 0.6);
    }

    function synthSnare() {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
        gain.gain.setValueAtTime(1.0, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now);
        osc.stop(now + 0.15);

        // スナッピー音
        const bufferSize = audioCtx.sampleRate * 0.15;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 1000;
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.8, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(masterGain);
        noise.start(now);
    }

    function synthHiHat(isOpen) {
        initAudio();
        const now = audioCtx.currentTime;
        const duration = isOpen ? 0.4 : 0.06;
        const bufferSize = audioCtx.sampleRate * duration;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 7000;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);
        noise.start(now);
    }

    function synthCymbal() {
        initAudio();
        const now = audioCtx.currentTime;
        const duration = 1.5;
        const bufferSize = audioCtx.sampleRate * duration;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 3500;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.9, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);
        noise.start(now);
    }

    function synthTom(pitch) {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(pitch * 0.4, now + 0.25);
        gain.gain.setValueAtTime(1.8, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now);
        osc.stop(now + 0.35);
    }

    // キット定義
    const KITS = {
        acoustic: [
            { name: "クラッシュ", class: "cymbal", fn: synthCymbal, key: "7" },
            { name: "ハイタム", fn: () => synthTom(180), key: "4" },
            { name: "ライド", class: "cymbal", fn: synthCymbal, key: "8" },
            { name: "ハイハット(閉)", fn: () => synthHiHat(false), key: "1" },
            { name: "スネア", fn: synthSnare, key: "2" },
            { name: "フロアタム", fn: () => synthTom(90), key: "6" },
            { name: "バスドラム (Kick)", class: "kick-pad", fn: synthKick, key: " " }
        ],
        wadaiko: [
            { name: "鉦 (チャンチキ)", class: "cymbal", fn: () => synthHiHat(false), key: "7" },
            { name: "締め太鼓", fn: () => synthTom(320), key: "4" },
            { name: "拍子木", fn: synthSnare, key: "8" },
            { name: "長胴太鼓", fn: () => synthTom(130), key: "1" },
            { name: "縁打ち", fn: synthSnare, key: "2" },
            { name: "大太鼓 (O-Daiko)", class: "kick-pad", fn: synthKick, key: " " }
        ],
        cyber: [
            { name: "808 CRASH", class: "cymbal", fn: synthCymbal, key: "7" },
            { name: "SYNTH TOM", fn: () => synthTom(220), key: "4" },
            { name: "808 HIHAT", fn: () => synthHiHat(false), key: "1" },
            { name: "808 SNARE", fn: synthSnare, key: "2" },
            { name: "DEEP KICK", class: "kick-pad", fn: synthKick, key: " " }
        ]
    };

    let currentKitKey = "acoustic";

    function renderDrumGrid() {
        const grid = document.getElementById("drum-grid");
        grid.innerHTML = "";
        const pads = KITS[currentKitKey];

        pads.forEach(pad => {
            const el = document.createElement("div");
            el.className = `drum-pad ${pad.class || ''}`;
            const hintText = pad.key === ' ' ? 'SPACE' : `[${pad.key.toUpperCase()}]`;
            el.innerHTML = `
                <div class="pad-name">${pad.name}</div>
                <div class="pad-hint">${hintText}</div>
            `;

            // タップ時のズーム防止（e.preventDefaultの徹底）
            const triggerAction = (e) => {
                e.preventDefault();
                initAudio();
                pad.fn();
                el.classList.add("active");
                setTimeout(() => el.classList.remove("active"), 120);

                if (isRecording) {
                    recordedEvents.push({ fn: pad.fn, time: Date.now() - recordStartTime });
                }
            };

            el.addEventListener("touchstart", triggerAction, { passive: false });
            el.addEventListener("mousedown", triggerAction);

            grid.appendChild(el);
        });
    }

    document.getElementById("kit-select").addEventListener("change", (e) => {
        currentKitKey = e.target.value;
        renderDrumGrid();
    });

    // キーボード操作対応
    window.addEventListener("keydown", (e) => {
        if (e.repeat) return;
        const key = e.key.toLowerCase();
        const pads = KITS[currentKitKey];
        pads.forEach(pad => {
            if (pad.key.toLowerCase() === key || (key === ' ' && pad.key === ' ')) {
                initAudio();
                pad.fn();
            }
        });
    });

    // 録音機能
    let isRecording = false;
    let recordStartTime = 0;
    let recordedEvents = [];
    let playbackInterval = null;

    const btnRecord = document.getElementById("btn-record");
    const btnPlay = document.getElementById("btn-play");
    const recordStatus = document.getElementById("record-status");

    btnRecord.addEventListener("click", () => {
        initAudio();
        isRecording = !isRecording;
        if (isRecording) {
            recordedEvents = [];
            recordStartTime = Date.now();
            btnRecord.textContent = "⏹ 停止";
            btnRecord.className = "btn btn-danger";
            recordStatus.textContent = "録音中...";
            btnPlay.disabled = true;
        } else {
            btnRecord.textContent = "🔴 録音";
            btnRecord.className = "btn btn-danger";
            recordStatus.textContent = recordedEvents.length > 0 ? "録音完了" : "待機中";
            if (recordedEvents.length > 0) btnPlay.disabled = false;
        }
    });

    btnPlay.addEventListener("click", () => {
        if (recordedEvents.length === 0) return;
        recordStatus.textContent = "再生中...";
        recordedEvents.forEach(ev => {
            setTimeout(() => {
                ev.fn();
            }, ev.time);
        });
        const maxTime = Math.max(...recordedEvents.map(e => e.time)) + 500;
        setTimeout(() => {
            recordStatus.textContent = "再生終了";
        }, maxTime);
    });

    // メトロノーム機能
    let isMetronomeActive = false;
    let metronomeTimer = null;
    const btnMetronome = document.getElementById("btn-metronome");

    btnMetronome.addEventListener("click", () => {
        initAudio();
        isMetronomeActive = !isMetronomeActive;
        if (isMetronomeActive) {
            btnMetronome.className = "btn btn-danger";
            const intervalMs = (60 / 120) * 1000;
            metronomeTimer = setInterval(() => {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.connect(gain);
                gain.connect(masterGain);
                osc.start(now);
                osc.stop(now + 0.05);
            }, intervalMs);
        } else {
            btnMetronome.className = "btn btn-secondary";
            clearInterval(metronomeTimer);
        }
    });

    // ヘルプモーダル
    const modal = document.getElementById("help-modal");
    document.getElementById("btn-help").addEventListener("click", () => modal.classList.add("active"));
    document.getElementById("close-modal").addEventListener("click", () => modal.classList.remove("active"));

    // 初期描画
    window.addEventListener("DOMContentLoaded", () => {
        renderDrumGrid();
    });
</script>

</body>
</html>
