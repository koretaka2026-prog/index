<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大富豪</title>

<style>
body{
    margin:0;
    background:#0b5d2a;
    color:white;
    font-family:sans-serif;
    text-align:center;
}

h1{
    margin:10px;
}

select,button{
    padding:8px;
    margin:4px;
    border:none;
    border-radius:6px;
}

#game{
    display:none;
}

.cards{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px;
    margin:10px;
}

.card{
    width:65px;
    height:95px;
    background:white;
    color:black;
    border-radius:8px;
    border:2px solid #333;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    user-select:none;
}

.red{
    color:red;
}

.selected{
    border:4px solid gold;
}

.back{
    background:#2850d0;
    color:white;
}

#message{
    height:30px;
    margin:10px;
    font-size:20px;
}

#field{
    min-height:120px;
}

#turn{
    font-size:22px;
    color:yellow;
}
</style>

</head>
<body>

<h1>🃏 大富豪</h1>

<div id="menu">

<div>
対戦
<select id="mode">
<option value="cpu">人 vs CPU</option>
<option value="human">人 vs 人</option>
</select>
</div>

<div>
先攻
<select id="first">
<option value="0">プレイヤー1</option>
<option value="1">プレイヤー2/CPU</option>
</select>
</div>

<div>
CPU強さ
<select id="ai">
<option value="0">弱い</option>
<option value="1">普通</option>
<option value="2">強い</option>
</select>
</div>

<button onclick="startGame()">ゲーム開始</button>

</div>

<div id="game">

<div id="turn"></div>

<h3>場</h3>
<div id="field" class="cards"></div>

<div id="message"></div>

<h3>相手</h3>
<div id="enemyInfo"></div>
<div id="enemyCards" class="cards"></div>

<h3>手札</h3>
<div id="playerCards" class="cards"></div>

<button onclick="playSelected()">出す</button>
<button onclick="pass()">パス</button>
<button onclick="location.reload()">最初から</button>

</div>

<script>

let players=[[],[]];
let selected=[];

let mode="cpu";
let aiLevel=0;

let turn=0;
let field=[];
let fieldRank=null;
let fieldCount=0;

let passCount=0;
let revolution=false;
let gameOver=false;

const suits=["♠","♥","♦","♣"];

function createDeck(){

    let deck=[];

    for(let s=0;s<4;s++){
        for(let r=3;r<=15;r++){

            let rank=r;

            if(r===14) rank=1;
            if(r===15) rank=2;

            deck.push({
                suit:suits[s],
                rank:rank
            });
        }
    }

    return deck;
}

function shuffle(a){
    for(let i=a.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
    }
}

function value(rank){

    if(rank===1) return 14;
    if(rank===2) return 15;
    return rank;
}

function compare(a,b){

    let va=value(a);
    let vb=value(b);

    if(revolution){
        return va<vb;
    }

    return va>vb;
}

function startGame(){

    mode=document.getElementById("mode").value;
    aiLevel=parseInt(document.getElementById("ai").value);

    let deck=createDeck();
    shuffle(deck);

    players=[[],[]];

    deck.forEach((c,i)=>{
        players[i%2].push(c);
    });

    players[0].sort(sortCards);
    players[1].sort(sortCards);

    turn=parseInt(document.getElementById("first").value);

    document.getElementById("menu").style.display="none";
    document.getElementById("game").style.display="block";

    updateUI();

    if(cpuTurnCheck()){
        setTimeout(cpuMove,1000);
    }
}

function sortCards(a,b){
    return value(a.rank)-value(b.rank);
}

function rankText(r){

    if(r===1) return "A";
    if(r===11) return "J";
    if(r===12) return "Q";
    if(r===13) return "K";
    if(r===2) return "2";

    return r;
}

function cardName(card){
    return card.suit + rankText(card.rank);
}

function updateUI(){

    if(gameOver) return;

    let me=turn;

    document.getElementById("turn").innerHTML=
        "現在の番 : " +
        (turn===0
        ?"プレイヤー1"
        :(mode==="cpu"?"CPU":"プレイヤー2"));

    drawField();
    drawPlayer();
    drawEnemy();

    checkWinner();
}

function drawField(){

    const area=document.getElementById("field");
    area.innerHTML="";

    field.forEach(card=>{

        let d=document.createElement("div");

        d.className="card";

        if(card.suit==="♥"||card.suit==="♦"){
            d.classList.add("red");
        }

        d.textContent=cardName(card);

        area.appendChild(d);
    });
}

function drawPlayer(){

    const area=document.getElementById("playerCards");
    area.innerHTML="";

    const me=turn;

    players[me].forEach((card,index)=>{

        let d=document.createElement("div");

        d.className="card";

        if(card.suit==="♥"||card.suit==="♦"){
            d.classList.add("red");
        }

        if(selected.includes(index)){
            d.classList.add("selected");
        }

        d.textContent=cardName(card);

        d.onclick=()=>{

            let pos=selected.indexOf(index);

            if(pos>=0){
                selected.splice(pos,1);
            }else{
                selected.push(index);
            }

            drawPlayer();
        };

        area.appendChild(d);
    });
}

function drawEnemy(){

    const area=document.getElementById("enemyCards");
    area.innerHTML="";

    let enemy=1-turn;

    document.getElementById("enemyInfo").textContent=
        "手札 : "+players[enemy].length+"枚";

    players[enemy].forEach(()=>{

        let d=document.createElement("div");

        d.className="card back";

        d.textContent="?";

        area.appendChild(d);

    });
}

function playSelected(){

    if(cpuTurnCheck()) return;
    if(selected.length===0) return;

    let hand=players[turn];

    let cards=selected.map(i=>hand[i]);

    let rank=cards[0].rank;

    for(let c of cards){
        if(c.rank!==rank){
            msg("同じ数字のみ出せます");
            return;
        }
    }

    if(field.length){

        if(cards.length!==fieldCount){
            msg("枚数が違います");
            return;
        }

        if(!compare(rank,fieldRank)){
            msg("場より強い札を出してください");
            return;
        }
    }

    selected.sort((a,b)=>b-a);

    selected.forEach(i=>{
        hand.splice(i,1);
    });

    field=[...cards];
    fieldRank=rank;
    fieldCount=cards.length;

    selected=[];

    if(rank===8){

        msg("8切り！");
        clearField();
    }

    if(cards.length===4){

        revolution=!revolution;

        msg(
            revolution
            ?"革命発生!"
            :"革命終了!"
        );
    }

    nextTurn();
}

function pass(){

    if(cpuTurnCheck()) return;

    passCount++;

    if(passCount>=1){
        clearField();
    }

    nextTurn();
}

function clearField(){

    field=[];
    fieldRank=null;
    fieldCount=0;
    passCount=0;
}

function nextTurn(){

    checkWinner();

    if(gameOver) return;

    turn=1-turn;

    updateUI();

    if(cpuTurnCheck()){
        setTimeout(cpuMove,1000);
    }
}

function cpuTurnCheck(){
    return mode==="cpu" && turn===1;
}

function cpuMove(){

    let hand=players[1];

    hand.sort(sortCards);

    let move=null;

    if(field.length===0){

        if(aiLevel===0){

            move=[hand[0]];

        }else if(aiLevel===1){

            move=[hand[0]];

        }else{

            move=[hand[0]];
        }

    }else{

        let candidates=
            hand.filter(c=>compare(c.rank,fieldRank));

        if(candidates.length){

            if(aiLevel===0){

                move=[
                    candidates[
                     Math.floor(Math.random()*candidates.length)
                    ]
                ];

            }else if(aiLevel===1){

                move=[candidates[0]];

            }else{

                move=[
                    candidates[candidates.length-1]
                ];
            }

        }
    }

    if(move===null){

        msg("CPU パス");

        passCount++;

        if(passCount>=1){
            clearField();
        }

        turn=0;

        updateUI();

        return;
    }

    move.forEach(card=>{

        let idx=hand.indexOf(card);

        if(idx>=0){
            hand.splice(idx,1);
        }
    });

    field=[...move];
    fieldRank=move[0].rank;
    fieldCount=1;

    if(move[0].rank===8){

        msg("CPU 8切り");

        clearField();
    }

    turn=0;

    checkWinner();

    updateUI();
}

function checkWinner(){

    if(players[0].length===0){

        gameOver=true;

        msg("🏆 プレイヤー1 勝利");
    }

    if(players[1].length===0){

        gameOver=true;

        msg(
            mode==="cpu"
            ?"🏆 CPU 勝利"
            :"🏆 プレイヤー2 勝利"
        );
    }
}

function msg(t){
    document.getElementById("message").textContent=t;
}

</script>

</body>
</html>
