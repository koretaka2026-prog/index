<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BLOCK WORLD</title>

<style>
:root {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101820;
  color: #fff;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  user-select: none;
}

main {
  max-width: 950px;
  margin: auto;
  padding: 12px;
}

h1 {
  text-align: center;
  color: #fde047;
  margin: 4px 0;
  font-size: clamp(28px, 6vw, 42px);
}

.sub {
  text-align: center;
  color: #cbd5e1;
  margin: 0 0 10px;
}

.status,
.inventory,
.controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

.pill {
  background: #334155;
  border-radius: 12px;
  padding: 8px 14px;
  font-weight: 700;
}

/* ゲーム画面 */
.world {
  display: grid;
  grid-template-columns: repeat(16, 1fr);
  max-width: 850px;
  margin: auto;
  border: 4px solid #334155;
  box-shadow: 0 12px 35px #0008;
  background: #7dd3fc;
  touch-action: manipulation;
}

.cell {
  aspect-ratio: 1;
  border: 1px solid #0002;
  padding: 0;
  position: relative;
  min-width: 0;
  background: linear-gradient(#82d7ff, #aee7ff);
  cursor: pointer;
}

.cell:active {
  filter: brightness(1.2);
}

.player {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: clamp(14px, 3vw, 31px);
  z-index: 3;
}

.texture {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      135deg,
      #ffffff18 0 20%,
      transparent 20% 70%,
      #00000012 70%
    );
}

#message {
  text-align: center;
  color: #fde047;
  font-weight: 800;
  min-height: 38px;
  padding: 9px;
}

/* 所持ブロック */
.inv {
  min-width: 92px;
  border: 2px solid transparent;
  background: #334155;
  color: white;
  border-radius: 12px;
  padding: 7px;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
}

.inv.selected {
  border-color: #fde047;
  background: #475569;
  transform: translateY(-2px);
}

.inv:disabled {
  opacity: 0.4;
}

/* 操作ボタン */
.controls {
  max-width: 570px;
  margin: 14px auto 0;
}

.move {
  flex: 1;
  height: 62px;
  border: 0;
  border-radius: 16px;
  background: #475569;
  color: #fff;
  font-size: 28px;
  font-weight: 900;
  cursor: pointer;
  min-width: 90px;
}

.jump {
  background: #2563eb;
}

.restart {
  display: block;
  margin: 15px auto;
  background: #ef4444;
  color: #fff;
  border: 0;
  border-radius: 12px;
  padding: 12px 18px;
  font-weight: 800;
  cursor: pointer;
}

.help {
  text-align: center;
  color: #94a3b8;
  font-size: 13px;
  margin: 10px 0;
}

@media (max-width: 600px) {
  main {
    padding: 6px;
  }

  .world {
    border-width: 2px;
  }

  .inv {
    min-width: 77px;
    font-size: 13px;
  }

  .move {
    height: 56px;
  }
}
</style>
</head>

<body>

<main>

  <h1>⛏ BLOCK WORLD 🌳</h1>

  <p class="sub">
    掘って、集めて、自由に置こう！
  </p>

  <div class="status">
    <span class="pill">
      ❤️ HP: 10
    </span>

    <span class="pill">
      🧱 所持ブロック:
      <b id="total">0</b>
    </span>
  </div>

  <!-- ゲーム画面 -->
  <div
    id="world"
    class="world"
    aria-label="ゲームワールド">
  </div>

  <!-- メッセージ -->
  <div id="message">
    近くのブロックをタップ！
  </div>

  <!-- アイテム -->
  <div
    id="inventory"
    class="inventory">
  </div>

  <!-- 移動ボタン -->
  <div class="controls">

    <button
      type="button"
      class="move"
      id="left">
      ◀
    </button>

    <button
      type="button"
      class="move jump"
      id="jump">
      ⬆
    </button>

    <button
      type="button"
      class="move"
      id="right">
      ▶
    </button>

  </div>

  <button
    type="button"
    class="restart"
    id="restart">
    🔄 ワールドを作り直す
  </button>

  <p class="help">
    キーボード：← → で移動 /
    ↑ または Space でジャンプ
    ・ マウス/タップ対応
  </p>

</main>


<script>
(() => {

  "use strict";

  /* ==============================
     ワールド設定
  ============================== */

  const W = 16;
  const H = 12;

  const INFO = {
    dirt: ["土", "🟫"],
    stone: ["石", "🪨"],
    wood: ["木", "🪵"],
    grass: ["草", "🌱"],
    leaves: ["葉", "🍃"],
    sand: ["砂", "🟨"]
  };

  const COLORS = {
    dirt: "#75451f",
    stone: "#68747c",
    wood: "#8a5327",
    grass: "#49ad40",
    leaves: "#287a2c",
    sand: "#e7bd5b"
  };

  const GROUND = [
    8, 8, 8, 7,
    7, 7, 8, 8,
    9, 9, 8, 8,
    7, 7, 8, 8
  ];

  const START = {
    dirt: 5,
    stone: 2,
    wood: 2,
    grass: 1,
    leaves: 2,
    sand: 2
  };


  /* ==============================
     基本変数
  ============================== */

  const idx = (x, y) => y * W + x;

  const inside = (x, y) =>
    x >= 0 &&
    x < W &&
    y >= 0 &&
    y < H;

  let world;

  let player;

  let selected;

  let inventory;

  let jumpTimer = null;


  /* ==============================
     HTML要素
  ============================== */

  const worldEl =
    document.querySelector("#world");

  const invEl =
    document.querySelector("#inventory");

  const msgEl =
    document.querySelector("#message");

  const totalEl =
    document.querySelector("#total");


  /* ==============================
     ワールド生成
  ============================== */

  function makeWorld() {

    const w =
      Array(W * H).fill(null);

    /*
      地面を生成
    */

    for (let x = 0; x < W; x++) {

      for (
        let y = GROUND[x];
        y < H;
        y++
      ) {

        if (y === GROUND[x]) {

          w[idx(x, y)] =
            "grass";

        } else if (
          y <= GROUND[x] + 1
        ) {

          w[idx(x, y)] =
            "dirt";

        } else {

          w[idx(x, y)] =
            Math.random() < 0.45
              ? "stone"
              : "dirt";

        }
      }
    }


    /*
      砂地
    */

    for (
      let x = 12;
      x <= 14;
      x++
    ) {

      w[idx(
        x,
        GROUND[x]
      )] = "sand";

    }


    /*
      木を作る
    */

    for (const x of [5, 11]) {

      const gy =
        GROUND[x];

      /*
        幹
      */

      for (
        let i = 1;
        i <= 3;
        i++
      ) {

        w[idx(
          x,
          gy - i
        )] = "wood";

      }

      /*
        葉っぱ
      */

      const top =
        gy - 3;

      const leaves = [
        [-1, -1],
        [0, -1],
        [1, -1],

        [-2, 0],
        [-1, 0],
        [1, 0],
        [2, 0],

        [-1, 1],
        [1, 1]
      ];

      for (
        const [dx, dy]
        of leaves
      ) {

        const px =
          x + dx;

        const py =
          top + dy;

        if (
          inside(px, py) &&
          !w[idx(px, py)]
        ) {

          w[idx(px, py)] =
            "leaves";

        }
      }
    }

    return w;
  }


  /* ==============================
     当たり判定
  ============================== */

  function solid(x, y) {

    if (
      x < 0 ||
      x >= W ||
      y >= H
    ) {
      return true;
    }

    if (y < 0) {
      return false;
    }

    return (
      world[idx(x, y)]
      !== null
    );
  }


  /* ==============================
     重力
  ============================== */

  function gravity(p) {

    const q = {
      ...p
    };

    while (
      q.y < H - 1 &&
      !solid(
        q.x,
        q.y + 1
      )
    ) {

      q.y++;

    }

    return q;
  }


  /* ==============================
     メッセージ
  ============================== */

  function say(text) {

    msgEl.textContent =
      text;

  }


  /* ==============================
     画面描画
  ============================== */

  function render() {

    worldEl.innerHTML =
      "";

    world.forEach(
      (type, i) => {

        const x =
          i % W;

        const y =
          Math.floor(i / W);

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "cell";

        button.type =
          "button";


        /*
          ブロック
        */

        if (type) {

          button.style.background =
            COLORS[type];

          const texture =
            document.createElement(
              "span"
            );

          texture.className =
            "texture";

          button.append(
            texture
          );
        }


        /*
          プレイヤー
        */

        if (
          x === player.x &&
          y === player.y
        ) {

          const p =
            document.createElement(
              "span"
            );

          p.className =
            "player";

          p.textContent =
            "🙂";

          button.append(
            p
          );
        }


        /*
          採掘・設置
        */

        button.addEventListener(
          "click",
          () => interact(x, y)
        );

        worldEl.append(
          button
        );
      }
    );

    renderInventory();
  }


  /* ==============================
     インベントリ
  ============================== */

  function renderInventory() {

    invEl.innerHTML =
      "";

    let total = 0;

    for (
      const [
        type,
        [name, icon]
      ]
      of Object.entries(INFO)
    ) {

      total +=
        inventory[type] || 0;

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "inv" +
        (
          selected === type
            ? " selected"
            : ""
        );

      button.disabled =
        !(inventory[type] > 0);

      button.innerHTML =
        icon +
        " " +
        name +
        "<br>× " +
        (inventory[type] || 0);

      button.onclick =
        () => {

          selected =
            type;

          say(
            name +
            "を選択しました"
          );

          renderInventory();
        };

      invEl.append(
        button
      );
    }

    totalEl.textContent =
      total;
  }


  /* ==============================
     左右移動
  ============================== */

  function move(dx) {

    let q = {
      ...player
    };

    const nx =
      q.x + dx;


    /*
      画面端
    */

    if (
      nx < 0 ||
      nx >= W
    ) {
      return;
    }


    /*
      通常移動
    */

    if (
      !solid(nx, q.y)
    ) {

      q.x = nx;

      player =
        gravity(q);

    }

    /*
      1段のブロックなら登る
    */

    else if (
      q.y > 0 &&
      !solid(
        nx,
        q.y - 1
      ) &&
      !solid(
        q.x,
        q.y - 1
      )
    ) {

      q.x = nx;

      q.y--;

      player = q;
    }

    render();
  }


  /* ==============================
     ジャンプ
  ============================== */

  function jump() {

    /*
      空中ならジャンプ不可
    */

    if (
      !solid(
        player.x,
        player.y + 1
      )
    ) {
      return;
    }

    let q = {
      ...player
    };


    /*
      最大2マス上昇
    */

    if (
      q.y > 0 &&
      !solid(
        q.x,
        q.y - 1
      )
    ) {

      q.y--;

    }


    if (
      q.y > 0 &&
      !solid(
        q.x,
        q.y - 1
      )
    ) {

      q.y--;

    }


    player = q;

    render();


    /*
      少し待って落下
    */

    clearTimeout(
      jumpTimer
    );

    jumpTimer =
      setTimeout(
        () => {

          player =
            gravity(player);

          render();

        },
        280
      );
  }


  /* ==============================
     ブロック操作
  ============================== */

  function interact(x, y) {

    /*
      プレイヤーから遠すぎる
    */

    const distance =
      Math.abs(
        x - player.x
      ) +
      Math.abs(
        y - player.y
      );

    if (distance > 2) {

      say(
        "そこは遠すぎます！近づいてください。"
      );

      return;
    }


    /*
      プレイヤー自身の場所
    */

    if (
      x === player.x &&
      y === player.y
    ) {

      return;
    }


    const i =
      idx(x, y);

    const current =
      world[i];


    /*
      ブロック採掘
    */

    if (current) {

      world[i] =
        null;

      inventory[current] =
        (
          inventory[current] ||
          0
        ) + 1;

      say(
        INFO[current][1] +
        " " +
        INFO[current][0] +
        "を採掘！"
      );

      player =
        gravity(player);

      render();

      return;
    }


    /*
      ブロックを持っているか確認
    */

    if (
      (inventory[selected] || 0)
      <= 0
    ) {

      say(
        "そのブロックを持っていません"
      );

      return;
    }


    /*
      ブロック設置
    */

    world[i] =
      selected;

    inventory[selected]--;

    say(
      INFO[selected][1] +
      " " +
      INFO[selected][0] +
      "を設置！"
    );

    render();
  }


  /* ==============================
     ワールドリセット
  ============================== */

  function restart() {

    clearTimeout(
      jumpTimer
    );

    world =
      makeWorld();

    player = {
      x: 1,
      y: 7
    };

    inventory = {
      ...START
    };

    selected =
      "dirt";

    say(
      "🌎 新しいワールドを作りました！"
    );

    render();
  }


  /* ==============================
     スマホ・マウス操作
  ============================== */

  document
    .querySelector("#left")
    .onclick =
      () => move(-1);


  document
    .querySelector("#right")
    .onclick =
      () => move(1);


  document
    .querySelector("#jump")
    .onclick =
      jump;


  document
    .querySelector("#restart")
    .onclick =
      restart;


  /* ==============================
     キーボード操作
  ============================== */

  window.addEventListener(
    "keydown",
    event => {

      if (
        [
          "ArrowLeft",
          "ArrowRight",
          "ArrowUp",
          " "
        ].includes(
          event.key
        )
      ) {

        event.preventDefault();

      }


      if (
        event.key ===
        "ArrowLeft"
      ) {

        move(-1);

      }

      else if (
        event.key ===
        "ArrowRight"
      ) {

        move(1);

      }

      else if (
        event.key ===
        "ArrowUp" ||
        event.key === " "
      ) {

        jump();

      }
    },
    {
      passive: false
    }
  );


  /* ==============================
     ゲーム開始
  ============================== */

  restart();

})();
</script>

</body>
</html>
