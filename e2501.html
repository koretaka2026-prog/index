<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>タッチサッカー</title><style>body{margin:0;overflow:hidden;background:#0c7c24;touch-action:none;font-family:sans-serif}canvas{display:block;width:100vw;height:100vh}#ui{position:absolute;top:10px;left:0;right:0;text-align:center;color:#fff;font-size:28px;font-weight:bold;text-shadow:2px 2px 4px #000;pointer-events:none}</style></head><body><div id="ui">0 - 0</div><canvas id="game"></canvas><script>const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);const ui=document.getElementById('ui');let playerScore=0,cpuScore=0;const ball={x:0,y:0,vx:0,vy:0,r:14},player={x:0,y:0,r:24,color:'#2c7fff'},cpu={x:0,y:0,r:24,color:'#ff3c3c'};let dragging=false,dragX=0,dragY=0;function reset(){ball.x=canvas.width/2;ball.y=canvas.height/2;ball.vx=ball.vy=0;player.x=canvas.width*.25;player.y=canvas.height/2;cpu.x=canvas.width*.75;cpu.y=canvas.height/2}reset();function d(a,b,c,d){return Math.hypot(a-c,b-d)}function kick(p,s){let dx=ball.x-p.x,dy=ball.y-p.y,l=Math.hypot(dx,dy);if(!l)return;ball.vx+=dx/l*s;ball.vy+=dy/l*s}function score(p){if(p){playerScore++}else{cpuScore++}ui.textContent=playerScore+' - '+cpuScore;reset()}function pos(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}function start(e){let p=pos(e);if(d(p.x,p.y,player.x,player.y)<player.r+20)dragging=true}function move(e){if(!dragging)return;let p=pos(e);player.x=Math.max(player.r,Math.min(canvas.width/2-player.r,p.x));player.y=Math.max(player.r,Math.min(canvas.height-player.r,p.y));dragX=p.x;dragY=p.y}function end(){dragging=false;if(d(player.x,player.y,ball.x,ball.y)<player.r+ball.r+12)kick(player,8)}canvas.onmousedown=start;canvas.onmousemove=move;addEventListener('mouseup',end);canvas.ontouchstart=start;canvas.ontouchmove=move;addEventListener('touchend',end);function update(){cpu.x+=(ball.x-cpu.x)*.03;cpu.y+=(ball.y-cpu.y)*.03;cpu.x=Math.max(canvas.width/2+cpu.r,Math.min(canvas.width-cpu.r,cpu.x));if(d(cpu.x,cpu.y,ball.x,ball.y)<cpu.r+ball.r+8)kick(cpu,5);ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.99;ball.vy*=.99;if(ball.y-ball.r<0||ball.y+ball.r>canvas.height)ball.vy*=-1;const gt=canvas.height*.35,gb=canvas.height*.65;if(ball.x-ball.r<0){if(ball.y>gt&&ball.y<gb)score(false);else ball.vx*=-1}if(ball.x+ball.r>canvas.width){if(ball.y>gt&&ball.y<gb)score(true);else ball.vx*=-1}}function draw(){ctx.fillStyle='#0c7c24';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='white';ctx.lineWidth=4;ctx.strokeRect(10,10,canvas.width-20,canvas.height-20);ctx.beginPath();ctx.moveTo(canvas.width/2,10);ctx.lineTo(canvas.width/2,canvas.height-10);ctx.stroke();[player,cpu].forEach(p=>{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()});ctx.fillStyle='white';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill()}function loop(){update();draw();requestAnimationFrame(loop)}loop();</script></body></html>
