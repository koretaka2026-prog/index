<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シューティングゲーム</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:sans-serif;
    touch-action:none;
}

canvas{
    display:block;
}

#menu{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#000;
    color:white;
    z-index:10;
}

#menu h1{
    font-size:48px;
    margin-bottom:20px;
}

#menu button{
    margin:10px;
    padding:14px 32px;
    font-size:22px;
    cursor:pointer;
}

#ui{
    position:absolute;
    left:10px;
    top:10px;
    color:white;
    font-size:24px;
    z-index:5;
}
</style>
</head>
<body>

<div id="ui">
スコア: <span id="score">0</span>
　
ライフ: <span id="life">3</span>
</div>

<div id="menu">
    <h1>シューティングゲーム</h1>
    <p>難易度を選択してください</p>

    <button id="easyBtn">Easy</button>
    <button id="normalBtn">Normal</button>
    <button id="hardBtn">Hard</button>
</div>

<canvas id="canvas"></canvas>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}
resize();

window.addEventListener("resize",resize);

const menu=document.getElementById("menu");
const scoreText=document.getElementById("score");
const lifeText=document.getElementById("life");

let gameRunning=false;
let frame=0;

let score=0;
let life=3;

let enemySpawnRate=60;
let enemyBaseSpeed=3;

const player={
    x:0,
    y:0,
    w:40,
    h:40
};

let bullets=[];
let enemies=[];
let explosions=[];

function resetGame(){

    score=0;
    life=3;

    bullets=[];
    enemies=[];
    explosions=[];

    player.x=canvas.width/2;
    player.y=canvas.height-100;

    frame=0;

    updateUI();
}

function updateUI(){
    scoreText.textContent=score;
    lifeText.textContent=life;
}

function startGame(mode){

    if(mode==="easy"){
        enemySpawnRate=70;
        enemyBaseSpeed=2;
    }

    if(mode==="normal"){
        enemySpawnRate=45;
        enemyBaseSpeed=3.5;
    }

    if(mode==="hard"){
        enemySpawnRate=25;
        enemyBaseSpeed=5;
    }

    resetGame();

    gameRunning=true;
    menu.style.display="none";

    requestAnimationFrame(loop);
}

document.getElementById("easyBtn").onclick=
()=>startGame("easy");

document.getElementById("normalBtn").onclick=
()=>startGame("normal");

document.getElementById("hardBtn").onclick=
()=>startGame("hard");

function movePlayer(x,y){

    player.x=x;
    player.y=y;

    if(player.x<20) player.x=20;
    if(player.x>canvas.width-20) player.x=canvas.width-20;

    if(player.y<20) player.y=20;
    if(player.y>canvas.height-20) player.y=canvas.height-20;
}

canvas.addEventListener("mousemove",e=>{
    movePlayer(e.clientX,e.clientY);
});

canvas.addEventListener("mousedown",e=>{
    movePlayer(e.clientX,e.clientY);
});

canvas.addEventListener("touchstart",e=>{
    e.preventDefault();
    const t=e.touches[0];
    movePlayer(t.clientX,t.clientY);
},{passive:false});

canvas.addEventListener("touchmove",e=>{
    e.preventDefault();
    const t=e.touches[0];
    movePlayer(t.clientX,t.clientY);
},{passive:false});

function shoot(){

    if(!gameRunning) return;

    bullets.push({
        x:player.x,
        y:player.y-22,
        r:5,
        speed:12
    });
}

setInterval(shoot,120);

function spawnEnemy(){

    // スコア200以上なら20%で青敵

    if(score >= 500 && Math.random() < 0.2){

        enemies.push({
            x:Math.random()*canvas.width,
            y:-30,
            r:28,
            speed:enemyBaseSpeed*0.8,
            hp:6,
            boss:false,
            color:"deepskyblue",
            score:100
        });

    }else{

        enemies.push({
            x:Math.random()*canvas.width,
            y:-30,
            r:20,
            speed:enemyBaseSpeed+Math.random()*2,
            hp:1,
            boss:false,
            color:"red",
            score:10
        });

    }
}
function createExplosion(x,y){

    for(let i=0;i<12;i++){

        explosions.push({
            x:x,
            y:y,
            vx:(Math.random()-0.5)*6,
            vy:(Math.random()-0.5)*6,
            life:30
        });

    }
}

function hit(x1,y1,r1,x2,y2,r2){

    const dx=x1-x2;
    const dy=y1-y2;

    return dx*dx+dy*dy<(r1+r2)*(r1+r2);
}

function gameOver(){

    gameRunning=false;

    menu.innerHTML=`
    <h1>ゲームオーバー</h1>
    <h2>スコア ${score}</h2>
    <button onclick="location.reload()">
        もう一度遊ぶ
    </button>
    `;

    menu.style.display="flex";
}

function update(){

    frame++;

    if(frame%enemySpawnRate===0){
        spawnEnemy();
    }

    for(let b of bullets){
        b.y-=b.speed;
    }

    bullets=bullets.filter(b=>b.y>-50);

    for(let e of enemies){
        e.y+=e.speed;
    }

    for(let i=enemies.length-1;i>=0;i--){

        const e=enemies[i];

        if(e.y>canvas.height+50){

            enemies.splice(i,1);

            life--;

            updateUI();

            if(life<=0){
                gameOver();
            }
        }
    }

    for(let i=enemies.length-1;i>=0;i--){

        const e=enemies[i];

        if(hit(
            player.x,
            player.y,
            20,
            e.x,
            e.y,
            e.r
        )){

            createExplosion(e.x,e.y);

            enemies.splice(i,1);

            life--;

            updateUI();

            if(life<=0){
                gameOver();
            }
        }
    }

    for(let i=enemies.length-1;i>=0;i--){

        const e=enemies[i];

        for(let j=bullets.length-1;j>=0;j--){

            const b=bullets[j];

            if(hit(
                b.x,b.y,b.r,
                e.x,e.y,e.r
            )){

bullets.splice(j,1);

e.hp--;

if(e.hp <= 0){

    createExplosion(e.x,e.y);

    score += e.score;

    enemies.splice(i,1);

    updateUI();
}
``
                break;
            }
        }
    }

    for(let p of explosions){
        p.x+=p.vx;
        p.y+=p.vy;
        p.life--;
    }

    explosions=
    explosions.filter(p=>p.life>0);
}

function drawBackground(){

    ctx.fillStyle="#000";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="white";

    for(let i=0;i<100;i++){

        const x=(i*127)%canvas.width;
        const y=(i*211+frame*3)%canvas.height;

        ctx.fillRect(x,y,2,2);
    }
}

function drawPlayer(){

    ctx.fillStyle="cyan";

    ctx.beginPath();
    ctx.moveTo(player.x,player.y-24);
    ctx.lineTo(player.x-18,player.y+18);
    ctx.lineTo(player.x,player.y+8);
    ctx.lineTo(player.x+18,player.y+18);
    ctx.closePath();
    ctx.fill();
}

function draw(){

    drawBackground();

    drawPlayer();

    ctx.fillStyle="yellow";

    for(let b of bullets){

        ctx.beginPath();
        ctx.arc(
            b.x,
            b.y,
            b.r,
            0,
            Math.PI*2
        );
        ctx.fill();
    }

for(let e of enemies){

    ctx.fillStyle=e.color;

    ctx.beginPath();
    ctx.arc(
        e.x,
        e.y,
        e.r,
        0,
        Math.PI*2
    );
    ctx.fill();

    // HP表示

    if(e.hp > 1){

        ctx.fillStyle="white";
        ctx.font="16px sans-serif";
        ctx.textAlign="center";
        ctx.fillText(
            e.hp,
            e.x,
            e.y+5
        );
    }
}
    for(let p of explosions){

        ctx.fillStyle=
        `rgba(255,150,0,${
            p.life/30
        })`;

        ctx.beginPath();
        ctx.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI*2
        );
        ctx.fill();
    }
}

function loop(){

    if(!gameRunning) return;

    update();
    draw();

    requestAnimationFrame(loop);
}

drawBackground();

</script>

</body>
</html>
