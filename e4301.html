<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>タッチサッカー</title><style>body{margin:0;background:#0f5a1f;overflow:hidden;touch-action:none;font-family:sans-serif}canvas{display:block;width:100vw;height:100vh;background:#198c2f}#ui{position:fixed;top:10px;left:0;right:0;text-align:center;color:#fff;font-size:28px;font-weight:bold}#msg{position:fixed;bottom:15px;left:0;right:0;text-align:center;color:#fff}</style></head><body><div id="ui">0 - 0</div><div id="msg">ボールをドラッグしてシュート！</div><canvas id="game"></canvas><script>const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);let ps=0,cs=0;const ball={x:0,y:0,vx:0,vy:0,r:18};let dragging=false,aimX=0,aimY=0;function reset(){ball.x=canvas.width/2;ball.y=canvas.height/2;ball.vx=ball.vy=0}reset();function score(){ui.textContent=ps+' - '+cs}const ui=document.getElementById('ui');function goal(p){p?ps++:cs++;score();msg.textContent=p?'ゴール!!':'失点!';setTimeout(()=>{reset();cpu();},1000)}const msg=document.getElementById('msg');const gw=180;function draw(){ctx.fillStyle='#198c2f';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='white';ctx.lineWidth=4;ctx.strokeRect(20,20,canvas.width-40,canvas.height-40);ctx.beginPath();ctx.arc(canvas.width/2,canvas.height/2,80,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(canvas.width/2,20);ctx.lineTo(canvas.width/2,canvas.height-20);ctx.stroke();let gx=(canvas.width-gw)/2;ctx.fillStyle='#ddd';ctx.fillRect(gx,-5,gw,15);ctx.fillRect(gx,canvas.height-10,gw,15);ctx.fillStyle='white';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='black';ctx.stroke();if(dragging){ctx.strokeStyle='yellow';ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(aimX,aimY);ctx.stroke();}}function physics(){ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=0.992;ball.vy*=0.992;let gx=(canvas.width-gw)/2;if(ball.x-ball.r<20){ball.x=20+ball.r;ball.vx*=-0.9}if(ball.x+ball.r>canvas.width-20){ball.x=canvas.width-20-ball.r;ball.vx*=-0.9}if(ball.y-ball.r<20){if(ball.x>gx&&ball.x<gx+gw){goal(true);return}ball.y=20+ball.r;ball.vy*=-0.9}if(ball.y+ball.r>canvas.height-20){if(ball.x>gx&&ball.x<gx+gw){goal(false);return}ball.y=canvas.height-20-ball.r;ball.vy*=-0.9}}function cpu(){setTimeout(()=>{if(Math.abs(ball.vx)+Math.abs(ball.vy)>0.2)return;ball.vx=(ball.x-canvas.width/2)*0.04;ball.vy=(ball.y-canvas.height*0.85)*0.04;},1500)}function pos(e){return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY}}function start(e){let p=pos(e);if(Math.hypot(p.x-ball.x,p.y-ball.y)<=60){dragging=true;aimX=p.x;aimY=p.y}}function move(e){if(!dragging)return;let p=pos(e);aimX=p.x;aimY=p.y}function end(){if(!dragging)return;dragging=false;ball.vx=(ball.x-aimX)*0.15;ball.vy=(ball.y-aimY)*0.15;cpu()}canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);addEventListener('mouseup',end);canvas.addEventListener('touchstart',start);canvas.addEventListener('touchmove',move);canvas.addEventListener('touchend',end);(function loop(){physics();draw();requestAnimationFrame(loop)})();</script></body></html>
