<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaPipe Blendshapes 感情判定</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 90vw;
      max-width: 400px;
      aspect-ratio: 3 / 4;
      background-color: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .emotion-card {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      border-radius: 25px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.15);
      min-width: 220px;
    }

    .emotion-title {
      font-size: 1.4rem;
      font-weight: bold;
    }

    .emotion-detail {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 4px;
    }

    button {
      margin-top: 20px;
      background-color: #007aff;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      z-index: 20;
    }

    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }
  </style>

  <!-- MediaPipe Vision SDK の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>

    <div class="emotion-card">
      <div id="emotion-title" class="emotion-title">😐 普通</div>
      <div id="emotion-detail" class="emotion-detail">準備完了</div>
    </div>
  </div>

  <button id="start-btn">感情判定を起動</button>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('start-btn');
    const emotionTitle = document.getElementById('emotion-title');
    const emotionDetail = document.getElementById('emotion-detail');

    let faceLandmarker;
    let lastVideoTime = -1;

    // 1. 安全に vision オブジェクトを取得する
    function getVisionObject() {
      if (typeof vision !== 'undefined') return vision;
      if (typeof window.vision !== 'undefined') return window.vision;
      if (typeof tasksVision !== 'undefined') return tasksVision;
      return null;
    }

    // 2. MediaPipe の初期化
    async function initFaceLandmarker() {
      const visionObj = getVisionObject();
      if (!visionObj) {
        throw new Error("MediaPipe SDKのロードに失敗しました。CDN接続かLive Server等の実行環境を確認してください。");
      }

      const { FaceLandmarker, FilesetResolver } = visionObj;
      
      const filesetResolver = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
      );
      
      faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 1,
        outputFaceBlendshapes: true
      });
    }

    // 3. カメラ起動処理
    async function startCamera() {
      startBtn.innerText = "AIモデル読み込み中...";
      startBtn.disabled = true;

      try {
        await initFaceLandmarker();

        startBtn.innerText = "カメラ起動中...";
        const constraints = {
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        
        video.onloadeddata = () => {
          startBtn.style.display = 'none';
          predictWebcam();
        };
      } catch (err) {
        console.error("起動エラー:", err);
        alert("起動に失敗しました:\n" + err.message);
        startBtn.innerText = "再試行する";
        startBtn.disabled = false;
      }
    }

    // 4. 表情スコア判定
    function detectEmotionFromBlendshapes(blendshapes) {
      const scores = {};
      for (const shape of blendshapes) {
        scores[shape.categoryName] = shape.score;
      }

      const smileLeft = scores["mouthSmileLeft"] || 0;
      const smileRight = scores["mouthSmileRight"] || 0;
      const smileScore = (smileLeft + smileRight) / 2;

      const jawOpen = scores["jawOpen"] || 0;
      const browInnerUp = scores["browInnerUp"] || 0;
      const browDownLeft = scores["browDownLeft"] || 0;
      const browDownRight = scores["browDownRight"] || 0;

      if (smileScore > 0.4) {
        return { title: "😄 笑顔", color: "#34C759", detail: `笑顔度: ${Math.round(smileScore * 100)}%` };
      } else if (jawOpen > 0.35 && browInnerUp > 0.2) {
        return { title: "😲 びっくり！", color: "#FF9500", detail: `口開き: ${Math.round(jawOpen * 100)}%` };
      } else if ((browDownLeft + browDownRight) / 2 > 0.35) {
        return { title: "😠 怒り・真剣", color: "#FF3B30", detail: `眉寄せ: ${Math.round(((browDownLeft + browDownRight) / 2) * 100)}%` };
      } else {
        return { title: "😐 普通", color: "#FFFFFF", detail: "落ち着いた状態" };
      }
    }

    // 5. ループ実行
    async function predictWebcam() {
      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }

      const startTimeMs = performance.now();

      if (lastVideoTime !== video.currentTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, startTimeMs);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (results.faceBlendshapes && results.faceBlendshapes.length > 0) {
          const blendshapes = results.faceBlendshapes[0].categories;
          const emotion = detectEmotionFromBlendshapes(blendshapes);
          
          emotionTitle.innerText = emotion.title;
          emotionTitle.style.color = emotion.color;
          emotionDetail.innerText = emotion.detail;

          if (results.faceLandmarks && results.faceLandmarks.length > 0) {
            drawLandmarks(results.faceLandmarks[0]);
          }
        }
      }

      requestAnimationFrame(predictWebcam);
    }

    function drawLandmarks(landmarks) {
      ctx.fillStyle = "rgba(0, 122, 255, 0.5)";
      for (const point of landmarks) {
        const x = point.x * canvas.width;
        const y = point.y * canvas.height;
        ctx.beginPath();
        ctx.arc(x, y, 1, 0, 2 * Math.PI);
        ctx.fill();
      }
    }

    startBtn.addEventListener('click', startCamera);
  </script>
</body>
</html>
