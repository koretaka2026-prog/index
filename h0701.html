<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スライドパズル</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#222;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
}

h1{
    margin:20px 0 10px;
}

#info{
    margin-bottom:10px;
}

#board{
    width:min(90vw,500px);
    height:min(90vw,500px);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr);
    gap:4px;
    touch-action:manipulation;
}

.tile{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:2rem;
    font-weight:bold;
    border-radius:12px;
    cursor:pointer;
    user-select:none;
    transition:0.15s;
}

.tile:hover{
    transform:scale(1.03);
}

.empty{
    background:transparent;
    cursor:default;
}

button{
    margin-top:15px;
    padding:10px 20px;
    font-size:1rem;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#message{
    margin-top:12px;
    font-size:1.2rem;
    color:#ffe066;
    font-weight:bold;
}
</style>
</head>
<body>

<h1>スライドパズル</h1>

<div id="info">
    手数: <span id="moves">0</span>
</div>

<div id="board"></div>

<button id="shuffleBtn">シャッフル</button>

<div id="message"></div>

<script>
const board = document.getElementById("board");
const movesLabel = document.getElementById("moves");
const message = document.getElementById("message");

let tiles = [];
let moves = 0;

function init(){
    tiles = [...Array(15).keys()].map(i=>i+1);
    tiles.push(0);
    moves = 0;
    updateBoard();
}

function updateBoard(){
    board.innerHTML = "";
    movesLabel.textContent = moves;

    tiles.forEach((num,index)=>{
        const div = document.createElement("div");

        if(num===0){
            div.className = "tile empty";
        }else{
            div.className = "tile";
            div.textContent = num;

            div.addEventListener("click",()=>{
                moveTile(index);
            });
        }

        board.appendChild(div);
    });

    if(isSolved()){
        message.textContent = "🎉 クリア！";
    }else{
        message.textContent = "";
    }
}

function getMovableIndices(){
    const empty = tiles.indexOf(0);
    const row = Math.floor(empty / 4);
    const col = empty % 4;
    const result = [];

    if(row > 0) result.push(empty - 4);
    if(row < 3) result.push(empty + 4);
    if(col > 0) result.push(empty - 1);
    if(col < 3) result.push(empty + 1);

    return result;
}

function moveTile(index){
    const empty = tiles.indexOf(0);

    const row1 = Math.floor(index/4);
    const col1 = index%4;

    const row2 = Math.floor(empty/4);
    const col2 = empty%4;

    const adjacent =
        Math.abs(row1-row2)+Math.abs(col1-col2)===1;

    if(adjacent){
        [tiles[index], tiles[empty]] =
        [tiles[empty], tiles[index]];

        moves++;
        updateBoard();
    }
}

function shuffle(){
    for(let i=0;i<1000;i++){
        const movable = getMovableIndices();
        const target =
            movable[Math.floor(Math.random()*movable.length)];

        const empty = tiles.indexOf(0);

        [tiles[target], tiles[empty]] =
        [tiles[empty], tiles[target]];
    }

    moves = 0;
    updateBoard();
}

function isSolved(){
    for(let i=0;i<15;i++){
        if(tiles[i] !== i+1){
            return false;
        }
    }
    return tiles[15] === 0;
}

document.getElementById("shuffleBtn")
        .addEventListener("click",shuffle);

init();
shuffle();
</script>
