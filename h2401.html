<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>絵合わせゲーム 完全版</title>

<style>
body{
    margin:0;
    padding:20px;
    font-family:sans-serif;
    background:#f4f7fb;
    text-align:center;
}

h1{
    color:#333;
}

.controls{
    margin:15px 0;
}

select, button{
    padding:10px;
    font-size:16px;
    border-radius:8px;
    border:1px solid #aaa;
}

button{
    cursor:pointer;
    background:#4285f4;
    color:white;
    border:none;
}

button:hover{
    background:#2f6fe0;
}

.info{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin:15px 0;
    font-size:18px;
    font-weight:bold;
}

#game{
    max-width:900px;
    margin:auto;
    display:grid;
    gap:10px;
}

.card{
    aspect-ratio:1;
    background:#4285f4;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    cursor:pointer;
    user-select:none;
    transition:0.3s;
    color:transparent;
}

.card.open{
    background:white;
    color:black;
}

.card.matched{
    background:#4CAF50;
    color:white;
}

.card:hover{
    transform:scale(1.03);
}
</style>
</head>
<body>

<h1>🎮 絵合わせゲーム 完全版</h1>

<div class="controls">
    カード枚数：
    <select id="cardCount">
        <option value="12">12枚</option>
        <option value="16" selected>16枚</option>
        <option value="20">20枚</option>
        <option value="24">24枚</option>
    </select>

    <button onclick="startGame()">ゲーム開始</button>
</div>

<div class="info">
    <div>⏰ 時間: <span id="time">0</span>秒</div>
    <div>🔄 手数: <span id="moves">0</span></div>
    <div>🏆 スコア: <span id="score">0</span></div>
</div>

<div id="game"></div>

<script>

const emojiPool=[
"🍎","🍌","🍇","🍉","🍓","🍒",
"🥝","🍍","🥕","🍋","🍑","🥥",
"🍔","🍕","🍟","🌭","🍩","🍰",
"⚽","🏀","🎾","🚗","🚀","🎲"
];

let firstCard=null;
let secondCard=null;
let lockBoard=false;

let moves=0;
let matchedPairs=0;
let timer=0;
let timerId=null;
let totalPairs=0;

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

function startGame(){

    clearInterval(timerId);

    const count=
        parseInt(document.getElementById("cardCount").value);

    totalPairs=count/2;

    moves=0;
    matchedPairs=0;
    timer=0;

    document.getElementById("moves").textContent=0;
    document.getElementById("time").textContent=0;
    document.getElementById("score").textContent=0;

    timerId=setInterval(()=>{
        timer++;
        document.getElementById("time").textContent=timer;
    },1000);

    firstCard=null;
    secondCard=null;
    lockBoard=false;

    const game=document.getElementById("game");

    let cols=4;
    if(count>=20) cols=5;

    game.style.gridTemplateColumns=`repeat(${cols},1fr)`;

    game.innerHTML="";

    let emojis=emojiPool.slice(0,totalPairs);
    let cards=[...emojis,...emojis];

    shuffle(cards);

    cards.forEach(icon=>{

        const card=document.createElement("div");

        card.className="card";
        card.textContent=icon;

        card.addEventListener("click",()=>flipCard(card));

        game.appendChild(card);
    });
}

function flipCard(card){

    if(lockBoard) return;

    if(card===firstCard) return;

    if(card.classList.contains("matched")) return;

    if(card.classList.contains("open")) return;

    card.classList.add("open");

    if(!firstCard){
        firstCard=card;
        return;
    }

    secondCard=card;

    moves++;
    document.getElementById("moves").textContent=moves;

    if(firstCard.textContent===secondCard.textContent){

        firstCard.classList.add("matched");
        secondCard.classList.add("matched");

        matchedPairs++;

        let score=
            Math.max(
                0,
                matchedPairs*100-moves*5-timer
            );

        document.getElementById("score").textContent=score;

        firstCard=null;
        secondCard=null;

        if(matchedPairs===totalPairs){

            clearInterval(timerId);

            setTimeout(()=>{

                let finalScore=
                    Math.max(
                        0,
                        matchedPairs*100-moves*5-timer
                    );

                alert(
                    "🎉 クリア！\n\n" +
                    "時間: " + timer + "秒\n" +
                    "手数: " + moves + "\n" +
                    "スコア: " + finalScore
                );

            },300);
        }

    }else{

        lockBoard=true;

        setTimeout(()=>{

            firstCard.classList.remove("open");
            secondCard.classList.remove("open");

            firstCard=null;
            secondCard=null;

            lockBoard=false;

        },800);
    }
}

startGame();

</script>

</body>
</html>
